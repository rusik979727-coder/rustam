<!DOCTYPE html>
<html lang="kk">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
  :root{--bg:#f4f6fb;--card:#fff;--ink:#1c2333;--muted:#6b7385;--line:#e3e7ef;--pri:#3b5bdb;--pri2:#e7ecff;--ok:#2b8a3e;--warn:#e67700;--bad:#c92a2a;--r:14px;
    --s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--s4:#eda100}
  *{box-sizing:border-box}
  body{margin:0;font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink)}
  header{background:var(--card);border-bottom:1px solid var(--line);padding:12px 16px;display:flex;align-items:center;gap:12px;position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
  header .logo{width:36px;height:36px;border-radius:10px;background:var(--pri);color:#fff;display:grid;place-items:center;font-weight:700;flex:none}
  header .who{flex:1;min-width:0}
  header .who b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  header .who small{color:var(--muted)}
  .lang{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;flex:none}
  .lang button{border-radius:0;padding:7px 10px;background:#fff;color:var(--muted);font-size:13px}
  .lang button.on{background:var(--pri);color:#fff}
  main{max-width:1100px;margin:0 auto;padding:16px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:16px;min-width:0}
  h2{font-size:17px;margin:0 0 12px}
  h3{font-size:15px;margin:0 0 8px}
  .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .between{justify-content:space-between}
  input,select,button{font:inherit}
  input[type=date],input[type=month],input[type=number].sm,select{padding:9px 10px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink)}
  button{border:0;border-radius:10px;padding:10px 14px;background:var(--pri2);color:var(--pri);font-weight:600;cursor:pointer}
  button.pri{background:var(--pri);color:#fff}
  button:disabled{opacity:.5;cursor:default}
  button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--pri);outline-offset:2px}
  .fields{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px;margin-top:14px}
  .f label{display:block;font-size:13px;color:var(--muted);margin-bottom:4px}
  .f input{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;font-size:18px;background:#fff}
  .f.calc input{background:#f1f3f8;color:var(--muted)}
  .hint{padding:10px 12px;border-radius:10px;background:var(--pri2);color:#243b8f;margin-top:12px;font-size:14px}
  .hint.warn{background:#fff4e6;color:#a74d00}
  .hint.ok{background:#ebfbee;color:#1e6b2f}
  .save{margin-top:16px;width:100%;padding:14px;font-size:16px}
  .tabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:16px;padding-bottom:2px}
  .tabs button{white-space:nowrap}
  .tabs button.on{background:var(--pri);color:#fff}
  .kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
  .kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;min-width:0}
  .kpi small{color:var(--muted);display:block;font-size:12px}
  .kpi b{font-size:22px;font-variant-numeric:tabular-nums}
  .kpi i{font-style:normal;color:var(--muted);font-size:12px}
  .kpi .d{font-size:12px;font-weight:600;margin-left:4px}
  .up{color:var(--ok)} .down{color:var(--bad)}
  .sec{font-size:13px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin:18px 0 8px}
  .funnel{display:flex;flex-direction:column;gap:6px}
  .fn{display:flex;align-items:center;gap:10px}
  .fn span{width:110px;font-size:13px;color:var(--muted);flex:none}
  .fn .bar{height:26px;background:var(--pri);border-radius:6px;color:#fff;font-size:13px;display:flex;align-items:center;padding:0 8px;min-width:34px;white-space:nowrap}
  .tbl{overflow-x:auto;-webkit-overflow-scrolling:touch}
  table{border-collapse:collapse;width:100%;font-size:13px;white-space:nowrap;font-variant-numeric:tabular-nums}
  th,td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:right}
  th:first-child,td:first-child{text-align:left;position:sticky;left:0;background:var(--card)}
  th{color:var(--muted);font-weight:600;background:#fafbfd}
  tr.tot td{font-weight:700;background:#fafbfd}
  td.today{background:var(--pri2)}
  .grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:16px}
  .chart{position:relative;height:240px}
  .insights{display:flex;flex-direction:column;gap:8px}
  .ins{padding:10px 12px;border-radius:10px;font-size:14px;display:flex;gap:8px}
  .ins.good{background:#ebfbee;color:#1e6b2f}
  .ins.warn{background:#fff4e6;color:#a74d00}
  .ins.info{background:var(--pri2);color:#243b8f}
  .links .l{display:flex;gap:8px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
  .links .l div{flex:1;min-width:0}
  .links .l small{color:var(--muted);display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .log div{padding:8px 0;border-bottom:1px solid var(--line);font-size:13px}
  .log small{color:var(--muted)}
  #toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#1c2333;color:#fff;padding:10px 16px;border-radius:10px;z-index:9}
  .center{text-align:center;padding:40px 16px;color:var(--muted)}
  .err{color:var(--bad)}
  .muted{color:var(--muted);font-size:13px}
  a{color:var(--pri)}
</style>
</head>

var LANG = 'kz';

function t(k){ return (T[LANG] && T[LANG][k] !== undefined) ? T[LANG][k] : T.kz[k]; }
function fl(f){ return LANG==='ru' ? (f.ru||f.kz) : f.kz; }
function errText(e){ var s=String(e); if(s.indexOf(' / ')>-1){ var p=s.split(' / '); return LANG==='ru'?p.slice(1).join(' / '):p[0]; } return s; }

function call(fn){
  var args = Array.prototype.slice.call(arguments,1);
  return new Promise(function(res,rej){
    var r = google.script.run.withSuccessHandler(res).withFailureHandler(function(e){ rej(errText(e && e.message ? e.message : e)); });
    r[fn].apply(r,args);
  });
}
function toast(m){ var e=$('toast'); e.textContent=m; e.hidden=false; clearTimeout(e._t); e._t=setTimeout(function(){e.hidden=true;},2500); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
function num(v){ var n=parseFloat(String(v==null?'':v).replace(',','.')); return isNaN(n)?0:n; }
function fmt(n,d){ if(n===''||n==null||isNaN(n)||!isFinite(n)) return '—'; return Number(n).toLocaleString('ru-RU',{maximumFractionDigits:d==null?2:d}); }
function money(n){ return (n===''||n==null)?'—':fmt(n,2); }
function pct(a,b){ return b? fmt(a/b*100,1)+'%' : '—'; }
function sum(a){ return (a||[]).reduce(function(s,v){return s+num(v);},0); }
function shiftDate(ds,k){ var p=ds.split('-'); var d=new Date(+p[0],+p[1]-1,+p[2]+k); return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2); }
function prevYm(ym){ var p=ym.split('-'); var d=new Date(+p[0],+p[1]-2,1); return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2); }
function isBoss(){ return S.init && S.init.user.role==='boss'; }
function firstDay(ym){ var st=(S.init&&S.init.startDate)||''; return st.slice(0,7)===ym ? +st.slice(8) : (st && ym<st.slice(0,7) ? 99 : 1); }
function clampDate(ds){ return (!isBoss() && S.init.startDate && ds<S.init.startDate) ? S.init.startDate : ds; }
function dd(i,ym){ return ('0'+(i+1)).slice(-2)+'.'+ym.slice(5); }
function kpi(label,val,sub,delta){ return '<div class="kpi"><small>'+label+'</small><b>'+val+'</b>'+(delta||'')+(sub?'<br><i>'+sub+'</i>':'')+'</div>'; }
function delta(cur,prev,invert){ if(!prev||!cur) return ''; var p=(cur-prev)/prev*100; var good=invert? p<0 : p>0; return '<span class="d '+(good?'up':'down')+'">'+(p>0?'▲':'▼')+fmt(Math.abs(p),0)+'%</span>'; }
function killCharts(){ S.charts.forEach(function(c){ try{c.destroy();}catch(e){} }); S.charts=[]; }

/* ===================== Іске қосу ===================== */
function setLangButtons(){ $('lkz').className=LANG==='kz'?'on':''; $('lru').className=LANG==='ru'?'on':''; document.documentElement.lang=LANG==='ru'?'ru':'kk'; }
function switchLang(l){ LANG=l; try{localStorage.setItem('lang',l);}catch(e){} setLangButtons(); if(S.init) renderAll(); }
$('lkz').onclick=function(){switchLang('kz');}; $('lru').onclick=function(){switchLang('ru');};
setLangButtons();

function renderAll(){
  var r=S.init;
  $('who').textContent = r.user.role==='boss' ? t('boss') : r.user.name;
  $('whoRole').textContent = t(r.user.role) + (r.user.block && r.user.role!=='boss' ? ' · ' + r.user.block : '');
  if (r.sheetUrl){ $('sheetLink').href=r.sheetUrl; $('sheetLink').textContent=t('openSheet'); $('sheetLink').hidden=false; } else $('sheetLink').hidden=true;
  killCharts();
  if (r.user.role==='boss') renderBoss(); else renderEmployee();

function drawForm(){
  var d=S.day, role=d.role, def=S.init.roles[role];
  if (!def) { $('form').innerHTML='<div class="center err">'+t('blockNotFound')+'</div>'; return; }
  var prefilled=false, html='<div class="fields">';
  def.fields.forEach(function(f){
    if (d.available.indexOf(f.key)===-1) return;
    var v=d.values[f.key]; if (v===undefined) v='';
    if (role==='callcenter' && f.key==='leads' && v==='' && d.targetLeads!=='' && d.targetLeads!=null){ v=d.targetLeads; prefilled=true; }
    var calc=f.type==='calc';
    html+='<div class="f'+(calc?' calc':'')+'"><label for="f_'+f.key+'">'+esc(fl(f))+'</label><input id="f_'+f.key+'" data-k="'+f.key+'" inputmode="decimal" '+(calc?'readonly tabindex="-1"':'')+' value="'+esc(v)+'" placeholder="0"></div>';
  });
  html+='</div><div id="hints"></div>';
  if (role==='callcenter') html+='<div class="hint">'+t('tgtToday')+'<b>'+(d.targetLeads===''||d.targetLeads==null?t('notYet'):fmt(d.targetLeads)+t('leadW'))+'</b>'+(d.targetSpend?' · $'+money(d.targetSpend):'')+(prefilled?'<br>'+t('prefilled'):'')+'</div>';
  html+='<button class="pri save" id="saveBtn">'+t('save')+'</button>';
  $('form').innerHTML=html;
  Array.prototype.forEach.call(document.querySelectorAll('#form input:not([readonly])'), function(i){ i.oninput=recalc; });

function vals(){ var o={}; Array.prototype.forEach.call(document.querySelectorAll('#form input[data-k]'), function(i){ o[i.dataset.k]=i.value.trim(); }); return o; }
function setCalc(k,v){ var i=document.querySelector('#form input[data-k="'+k+'"]'); if(i) i.value=v; }
function recalc(){
  var v=vals(), role=S.day.role, h='';
  if (role==='target') setCalc('cpl', num(v.leads)?(num(v.spend)/num(v.leads)).toFixed(2):'');
  else if (role==='callcenter'){
    setCalc('conv', num(v.leads)?(num(v.booked)/num(v.leads)*100).toFixed(1):'');
    var s=num(v.booked)+num(v.noanswer)+num(v.inwork)+num(v.refused);
    if (v.leads!=='') h = s===num(v.leads) ? '<div class="hint ok">'+t('allSplit')+' ('+s+' / '+num(v.leads)+')</div>' : '<div class="hint warn">'+t('splitWarn')(s,num(v.leads))+'</div>';
  } else if (role==='reception'){
    setCalc('total', (num(v.cash)+num(v.card)+num(v.transfer))||'');
    if (v.came!==''&&v.consult!==''&&num(v.came)>num(v.consult)) h+='<div class="hint warn">'+t('cameMore')+'</div>';
    if (v.bought!==''&&v.came!==''&&num(v.bought)>num(v.came)) h+='<div class="hint warn">'+t('boughtMore')+'</div>';
  }
  $('hints').innerHTML=h;
}
function save(){
  var b=$('saveBtn'); b.disabled=true; b.textContent=t('saving');
  var v=vals(); S.init.roles[S.day.role].fields.forEach(function(f){ if(f.type==='calc') delete v[f.key]; });
  call('apiSaveDay', S.key, S.block, S.date, v).then(function(d){ S.day=d; drawForm(); toast(t('saved')); if($('mon')) loadMonthBlock(); })
    .catch(function(e){ b.disabled=false; b.textContent=t('save'); toast(t('err')+e); });
}

function loadMonthBlock(){
  var box=$('month'); if(!box) return;
  box.innerHTML='<div class="center">'+t('loading')+'</div>';
  var ym=$('mon').value;
  call('apiGetMonthBlock', S.key, S.block, ym).then(function(r){
    var def=S.init.roles[r.role];

    if (!keys.length){ box.innerHTML='<div class="center">'+t('noData')+'</div>'; $('mystats').innerHTML=''; return; }
    var f0=firstDay(ym)-1;
    keys.forEach(function(f){ r.rows[f.key]=r.rows[f.key].map(function(x,i){ return i<f0?'':x; }); });
    drawMyStats(r, f0);
    var todayD=S.init.today.slice(0,7)===ym ? +S.init.today.slice(8) : 0;
    var h='<table><tr><th>'+t('day')+'</th>'+keys.map(function(f){return '<th>'+esc(fl(f))+'</th>';}).join('')+'</tr>';
    for (var i=f0;i<r.days;i++) h+='<tr><td'+(i+1===todayD?' class="today"':'')+'>'+dd(i,ym)+'</td>'+keys.map(function(f){ var x=r.rows[f.key][i]; return '<td>'+(x===''?'':fmt(x))+'</td>'; }).join('')+'</tr>';
    h+='<tr class="tot"><td>'+t('total')+'</td>'+keys.map(function(f){
      if (f.key==='cpl') return '<td>'+money(sum(r.rows.leads)?sum(r.rows.spend)/sum(r.rows.leads):'')+'</td>';
      if (f.key==='conv') return '<td>'+pct(sum(r.rows.booked),sum(r.rows.leads))+'</td>';
      return '<td>'+fmt(sum(r.rows[f.key]))+'</td>'; }).join('')+'</tr></table>';

function drawMyStats(r){
  var R=r.rows, n=function(k){return sum(R[k]);}, days=(R[Object.keys(R)[0]]||[]).filter(function(x,i){ return Object.keys(R).some(function(k){return R[k][i]!==''&&R[k][i]!==0;}); }).length || 0, h='';
  if (r.role==='target') h=kpi(t('leads'),fmt(n('leads'),0),days?fmt(n('leads')/days,1)+' '+t('perDay'):'')+kpi(t('spent'),'$'+money(n('spend')))+kpi(t('avgCpl'),n('leads')?'$'+money(n('spend')/n('leads')):'—');

  else { var k=n('cash')+n('card')+n('transfer')||n('total');

  $('mystats').innerHTML='<div class="sec" style="margin-top:0">'+t('myStats')+'</div><div class="kpis">'+h+'</div>';
}

function monthPicker(id){ return '<input type="month" id="'+id+'" value="'+(S.smon||S.init.today.slice(0,7))+'">'; }

function agg(blocks, role, key, days){
  var out=[]; for(var i=0;i<days;i++) out.push(0);
  blocks.filter(function(b){return b.role===role && b.rows[key];}).forEach(function(b){ b.rows[key].forEach(function(v,i){ if(i<days) out[i]+=num(v); }); });
  return out;
}
function model(r){
  var B=r.blocks, D=r.days, A=function(role,k){ return agg(B,role,k,D); };
  var m={D:D,B:B,leads:A('target','leads'),spend:A('target','spend'),cc:A('callcenter','leads'),booked:A('callcenter','booked'),noans:A('callcenter','noanswer'),inwork:A('callcenter','inwork'),ccRef:A('callcenter','refused'),
    consult:A('reception','consult'),came:A('reception','came'),bought:A('reception','bought'),think:A('reception','thinking'),rRef:A('reception','refused'),cash:A('reception','cash'),card:A('reception','card'),tr:A('reception','transfer')};
  m.kassa=m.cash.map(function(v,i){return v+m.card[i]+m.tr[i];});
  var kt=A('reception','total'); if(sum(m.kassa)===0&&sum(kt)>0) m.kassa=kt;
  ['leads','spend','cc','booked','noans','inwork','ccRef','consult','came','bought','think','rRef','cash','card','tr','kassa'].forEach(function(k){ m['T'+k]=sum(m[k]); });
  return m;
}

function drawAnalytics(r, pr, ym){
  if (!r.sheetName){ $('an').innerHTML='<div class="center">'+t('noSheet')+'</div>'; return; }
  var m=model(r), p=(pr&&pr.sheetName)?model(pr):null, rate=getRate();
  var f0=firstDay(ym)-1, last=-1;
  for (var j=0;j<m.D;j++) if (m.leads[j]||m.cc[j]||m.consult[j]||m.came[j]||m.kassa[j]) last=j;
  var idx=[]; for(var i=f0;i<=last;i++) idx.push(i);
  var labels=idx.map(function(i){return dd(i,ym);});
  // Өткен айды сол күн санымен салыстыру
  var P=function(k){ return p? sum(p[k].slice(0,last+1)) : 0; };
  var cpl=m.Tleads?m.Tspend/m.Tleads:0, pcpl=P('leads')?P('spend')/P('leads'):0;
  var conv=m.Tcc?m.Tbooked/m.Tcc:0;

  var h='<p class="muted">'+(p?'▲▼ — '+t('vsPrev'):'')+'</p>';
  h+='<div class="kpis">'+
    kpi(t('leads'),fmt(m.Tleads,0),'',delta(m.Tleads,P('leads')))+
    kpi(t('avgCpl'),cpl?'$'+money(cpl):'—','',delta(cpl,pcpl,true))+
    kpi(t('booked'),fmt(m.Tbooked,0),t('conv')+pct(m.Tbooked,m.Tcc),delta(m.Tbooked,P('booked')))+
    kpi(t('came'),fmt(m.Tcame,0),'',delta(m.Tcame,P('came')))+
    kpi(t('bought'),fmt(m.Tbought,0),'',delta(m.Tbought,P('bought')))+
    kpi(t('kassa'),fmt(m.Tkassa,0),'',delta(m.Tkassa,P('kassa')))+'</div>';

  // Қорытындылар
  var ins=[];
  if (m.Tcc>=5){
    var na=m.Tnoans/m.Tcc; if(na>0.3) ins.push(['warn',t('insNoans')(pct(m.Tnoans,m.Tcc))]);
    if(conv<0.2) ins.push(['warn',t('insConvLow')(pct(m.Tbooked,m.Tcc))]); else ins.push(['good',t('insConvGood')(pct(m.Tbooked,m.Tcc))]);
  }
  if (m.Tbooked>=3 && m.Tcame) ins.push(['info',t('insCame')(pct(m.Tcame,m.Tbooked))]);
  if (m.Tcame>=3) ins.push([m.Tbought/m.Tcame>=0.5?'good':'info',t('insSale')(pct(m.Tbought,m.Tcame))]);
  if (m.Tleads>=10 && Math.abs(m.Tleads-m.Tcc)/m.Tleads>0.15) ins.push(['warn',t('insGap')(fmt(m.Tleads,0),fmt(m.Tcc,0))]);
  var l7=idx.slice(-7), s7=l7.reduce(function(a,i){return a+m.spend[i];},0), n7=l7.reduce(function(a,i){return a+m.leads[i];},0);
  if (n7 && cpl && idx.length>7) ins.push(['info',t('insCpl')(money(s7/n7),money(cpl))]);
  h+='<div class="sec">'+t('insights')+'</div><div class="insights">'+(ins.length?ins.map(function(x){return '<div class="ins '+x[0]+'">'+esc(x[1])+'</div>';}).join(''):'<div class="ins info">'+t('insEmpty')+'</div>')+'</div>';

  // Графиктер
  h+='<div class="grid2" style="margin-top:16px">'+
    '<div><h3>'+t('chFunnel')+'</h3><div class="chart"><canvas id="c1"></canvas></div></div>'+
    '<div><h3>'+t('chKassa')+'</h3><div class="chart"><canvas id="c2"></canvas></div></div>'+
    '<div><h3>'+t('chCpl')+'</h3><div class="chart"><canvas id="c3"></canvas></div></div>'+
    '<div><h3>'+t('chConv')+'</h3><div class="chart"><canvas id="c4"></canvas></div></div></div>';

  // Жарнама тиімділігі
  var Sp=m.Tspend, romi=Sp? (m.Tkassa/rate)/Sp : 0;
  h+='<div class="sec">'+t('unitEcon')+'</div><div class="kpis">'+
    kpi(t('perLead'),m.Tleads?'$'+money(Sp/m.Tleads):'—')+kpi(t('perBooked'),m.Tbooked?'$'+money(Sp/m.Tbooked):'—')+
    kpi(t('perCame'),m.Tcame?'$'+money(Sp/m.Tcame):'—')+kpi(t('perSale'),m.Tbought?'$'+money(Sp/m.Tbought):'—')+
    kpi(t('romi'),romi?fmt(romi,1)+'×':'—','$'+money(m.Tkassa/rate)+' / $'+money(Sp))+
    '<div class="kpi"><small><label for="rate">'+t('rate')+'</label></small><input id="rate" class="sm" type="number" min="1" step="1" value="'+rate+'" style="width:100%;margin-top:4px"></div></div>';

  // Операторлар
  var ccB=m.B.filter(function(b){return b.role==='callcenter';}), rcB=m.B.filter(function(b){return b.role==='reception';});
  h+='<div class="sec">'+t('ops')+'</div><div class="tbl"><table><tr><th>'+t('thOp')+'</th><th>'+t('newLeads')+'</th><th>'+t('booked')+'</th><th>'+t('thConv')+'</th><th>'+t('thNoans')+'</th><th>'+t('thRef')+'</th></tr>'+
    ccB.map(function(b){ var R=b.rows, l=sum(R.leads); return '<tr><td>'+esc(b.id)+'</td><td>'+fmt(l,0)+'</td><td>'+fmt(sum(R.booked),0)+'</td><td>'+pct(sum(R.booked),l)+'</td><td>'+pct(sum(R.noanswer),l)+'</td><td>'+pct(sum(R.refused),l)+'</td></tr>'; }).join('')+'</table></div>';
  h+='<div class="sec">'+t('recs')+'</div><div class="tbl"><table><tr><th>'+t('thBlock')+'</th><th>'+t('consult')+'</th><th>'+t('thCameP')+'</th><th>'+t('thBoughtP')+'</th><th>'+t('thKassa')+'</th><th>'+t('thAvg')+'</th></tr>'+
    rcB.map(function(b){ var R=b.rows, k=sum(R.cash)+sum(R.card)+sum(R.transfer)||sum(R.total), bt=sum(R.bought); return '<tr><td>'+esc(b.id)+'</td><td>'+fmt(sum(R.consult),0)+'</td><td>'+pct(sum(R.came),sum(R.consult))+'</td><td>'+pct(bt,sum(R.came))+'</td><td>'+fmt(k,0)+'</td><td>'+(bt?fmt(k/bt,0):'—')+'</td></tr>'; }).join('')+'</table></div>';

  // Апта күндері
  var p_=ym.split('-'), wd=[0,1,2,3,4,5,6].map(function(){return {n:0,leads:0,booked:0,came:0,kassa:0};});
  idx.forEach(function(i){ var has=m.leads[i]||m.cc[i]||m.came[i]||m.kassa[i]; if(!has) return; var w=(new Date(+p_[0],+p_[1]-1,i+1).getDay()+6)%7; var o=wd[w]; o.n++; o.leads+=m.leads[i]; o.booked+=m.booked[i]; o.came+=m.came[i]; o.kassa+=m.kassa[i]; });
  h+='<div class="sec">'+t('weekdays')+'</div><div class="tbl"><table><tr><th>'+t('thWd')+'</th><th>'+t('thDays')+'</th><th>'+t('thLead')+'</th><th>'+t('thBooked')+'</th><th>'+t('thCame')+'</th><th>'+t('thKassa')+'</th></tr>'+
    wd.map(function(o,i){ return '<tr><td>'+t('wd')[i]+'</td><td>'+o.n+'</td><td>'+(o.n?fmt(o.leads/o.n,1):'—')+'</td><td>'+(o.n?fmt(o.booked/o.n,1):'—')+'</td><td>'+(o.n?fmt(o.came/o.n,1):'—')+'</td><td>'+(o.n?fmt(o.kassa/o.n,0):'—')+'</td></tr>'; }).join('')+'</table></div>';

  // Үздік күндер
  var best=function(arr){ var bi=-1,bv=0; idx.forEach(function(i){ if(arr[i]>bv){bv=arr[i];bi=i;} }); return bi<0?'—':dd(bi,ym)+' · '+fmt(bv,1); };
  var convArr=m.cc.map(function(l,i){ return l>=3? m.booked[i]/l*100 : 0; });
  h+='<div class="sec">'+t('best')+'</div><div class="kpis">'+kpi(t('bestKassa'),'<span style="font-size:16px">'+best(m.kassa)+'</span>')+kpi(t('bestLeads'),'<span style="font-size:16px">'+best(m.leads)+'</span>')+kpi(t('bestConv'),'<span style="font-size:16px">'+(best(convArr)==='—'?'—':best(convArr)+'%')+'</span>')+'</div>';

  $('an').innerHTML=h;
  $('rate').onchange=function(){ var v=+this.value; if(v>0){ try{localStorage.setItem('usdRate',v);}catch(e){} drawAnalytics(r,pr,ym); } };
  drawCharts(m, idx, labels);
}

function drawCharts(m, idx, labels){
  killCharts();
  if (typeof Chart==='undefined') return;
  var pick=function(a){ return idx.map(function(i){return a[i]||0;}); };
  var css=getComputedStyle(document.documentElement), c=function(n){return css.getPropertyValue(n).trim();};
  var grid={color:'#eef0f4'}, ticks={color:c('--muted'),font:{size:11}}, yticks={color:c('--muted'),font:{size:11},callback:function(v){return Number(v).toLocaleString('ru-RU');}};
  var base={responsive:true,maintainAspectRatio:false,interaction:{mode:'index',intersect:false},
    plugins:{legend:{position:'bottom',labels:{boxWidth:10,boxHeight:10,usePointStyle:true,color:c('--ink')}},tooltip:{backgroundColor:'#1c2333'}},
    scales:{x:{grid:{display:false},ticks:ticks},y:{beginAtZero:true,grid:grid,ticks:yticks,border:{display:false}}}};
  var line=function(label,data,color){ return {label:label,data:data,borderColor:color,backgroundColor:color,borderWidth:2,pointRadius:4,pointHoverRadius:6,tension:.25}; };
  var one=JSON.parse(JSON.stringify(base)); one.plugins.legend={display:false}; one.scales.y.ticks=yticks;
  S.charts.push(new Chart($('c1'),{type:'line',data:{labels:labels,datasets:[line(t('fLead'),pick(m.leads),c('--s1')),line(t('fBooked'),pick(m.booked),c('--s2')),line(t('fCame'),pick(m.came),c('--s3')),line(t('fBought'),pick(m.bought),c('--s4'))]},options:base}));
  var stacked=JSON.parse(JSON.stringify(base)); stacked.scales.x.stacked=true; stacked.scales.y.stacked=true; stacked.scales.y.ticks=yticks;
  var bar=function(label,data,color){ return {label:label,data:data,backgroundColor:color,borderColor:'#fff',borderWidth:{top:2},borderRadius:4,borderSkipped:'bottom',maxBarThickness:28}; };
  S.charts.push(new Chart($('c2'),{type:'bar',data:{labels:labels,datasets:[bar(t('cash'),pick(m.cash),c('--s1')),bar(t('card'),pick(m.card),c('--s2')),bar(t('transfer'),pick(m.tr),c('--s3'))]},options:stacked}));
  S.charts.push(new Chart($('c3'),{type:'line',data:{labels:labels,datasets:[line(t('avgCpl'),idx.map(function(i){return m.leads[i]?Math.round(m.spend[i]/m.leads[i]*100)/100:null;}),c('--s1'))]},options:one}));
  S.charts.push(new Chart($('c4'),{type:'line',data:{labels:labels,datasets:[line(t('chConv'),idx.map(function(i){return m.cc[i]?Math.round(m.booked[i]/m.cc[i]*1000)/10:null;}),c('--s2'))]},options:one}));
}

/* ===================== Журнал, сілтемелер ===================== */
function renderLog(box){
  box.innerHTML='<div class="card"><h2>'+t('logTitle')+'</h2><div class="log" id="lg"><div class="center">'+t('loading')+'</div></div></div>';
  call('apiGetLog', S.key).then(function(r){
    $('lg').innerHTML = r.length ? r.map(function(x){ return '<div><b>'+esc(x.name)+'</b> · '+esc(x.block)+' · '+esc(x.date)+' <small>('+esc(x.time)+')</small><br>'+esc(x.changes)+'</div>'; }).join('') : '<div class="center">'+t('noLog')+'</div>';
  }).catch(function(e){ $('lg').innerHTML='<div class="center err">'+esc(e)+'</div>'; });
}
function renderLinks(box){
  box.innerHTML='<div class="card"><h2>'+t('linksTitle')+'</h2><p class="muted" style="margin-top:0">'+t('linksNote')+'</p><div class="links" id="lk"><div class="center">'+t('loading')+'</div></div></div>';
  call('apiGetLinks', S.key).then(function(r){
    $('lk').innerHTML = r.map(function(u,i){ return '<div class="l"><div><b>'+esc(u.name)+'</b> · '+esc(t(u.role)||u.role)+(u.block?' · '+esc(u.block):'')+'<small>'+esc(u.url)+'</small></div><button data-i="'+i+'">'+t('copy')+'</button></div>'; }).join('');
    Array.prototype.forEach.call(document.querySelectorAll('#lk button'), function(b){
      b.onclick=function(){ var u=r[+b.dataset.i].url;
        (navigator.clipboard? navigator.clipboard.writeText(u) : Promise.reject()).then(function(){toast(t('copied'));}).catch(function(){ var s=b.parentNode.querySelector('small'); var rg=document.createRange(); rg.selectNodeContents(s); var sl=getSelection(); sl.removeAllRanges(); sl.addRange(rg); }); };
    });
  }).catch(function(e){ $('lk').innerHTML='<div class="center err">'+esc(e)+'</div>'; });
}

boot();
</script>
