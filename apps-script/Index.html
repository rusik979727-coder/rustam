<!DOCTYPE html>
<html lang="kk">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root{--bg:#f4f6fb;--card:#fff;--ink:#1c2333;--muted:#6b7385;--line:#e3e7ef;--pri:#3b5bdb;--pri2:#e7ecff;--ok:#2b8a3e;--warn:#e67700;--bad:#c92a2a;--r:14px}
  *{box-sizing:border-box}
  body{margin:0;font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink)}
  header{background:var(--card);border-bottom:1px solid var(--line);padding:12px 16px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:5}
  header .logo{width:36px;height:36px;border-radius:10px;background:var(--pri);color:#fff;display:grid;place-items:center;font-weight:700}
  header .who{flex:1;min-width:0}
  header .who b{display:block}
  header .who small{color:var(--muted)}
  main{max-width:1100px;margin:0 auto;padding:16px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:16px}
  h2{font-size:17px;margin:0 0 12px}
  .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  input,select,button{font:inherit}
  input[type=date],input[type=month],select{padding:9px 10px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink)}
  button{border:0;border-radius:10px;padding:10px 14px;background:var(--pri2);color:var(--pri);font-weight:600;cursor:pointer}
  button.pri{background:var(--pri);color:#fff}
  button:disabled{opacity:.5;cursor:default}
  .fields{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px;margin-top:14px}
  .f label{display:block;font-size:13px;color:var(--muted);margin-bottom:4px}
  .f input{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;font-size:18px;background:#fff}
  .f input:focus{outline:2px solid var(--pri2);border-color:var(--pri)}
  .f.calc input{background:#f1f3f8;color:var(--muted)}
  .hint{padding:10px 12px;border-radius:10px;background:var(--pri2);color:#243b8f;margin-top:12px;font-size:14px}
  .hint.warn{background:#fff4e6;color:#a74d00}
  .hint.ok{background:#ebfbee;color:#1e6b2f}
  .save{margin-top:16px;width:100%;padding:14px;font-size:16px}
  .tabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:16px}
  .tabs button{white-space:nowrap}
  .tabs button.on{background:var(--pri);color:#fff}
  .kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
  .kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px}
  .kpi small{color:var(--muted);display:block;font-size:12px}
  .kpi b{font-size:22px}
  .kpi i{font-style:normal;color:var(--muted);font-size:12px}
  .sec{font-size:13px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin:18px 0 8px}
  .funnel{display:flex;flex-direction:column;gap:6px}
  .fn{display:flex;align-items:center;gap:10px}
  .fn span{width:110px;font-size:13px;color:var(--muted)}
  .fn .bar{height:26px;background:var(--pri);border-radius:6px;color:#fff;font-size:13px;display:flex;align-items:center;padding:0 8px;min-width:34px}
  .tbl{overflow-x:auto;-webkit-overflow-scrolling:touch}
  table{border-collapse:collapse;width:100%;font-size:13px;white-space:nowrap}
  th,td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:right}
  th:first-child,td:first-child{text-align:left;position:sticky;left:0;background:var(--card)}
  th{color:var(--muted);font-weight:600;background:#fafbfd}
  tr.tot td{font-weight:700;background:#fafbfd}
  td.today{background:var(--pri2)}
  .links .l{display:flex;gap:8px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
  .links .l div{flex:1;min-width:0}
  .links .l small{color:var(--muted);display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .log div{padding:8px 0;border-bottom:1px solid var(--line);font-size:13px}
  .log small{color:var(--muted)}
  #toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#1c2333;color:#fff;padding:10px 16px;border-radius:10px;display:none;z-index:9}
  .center{text-align:center;padding:60px 16px;color:var(--muted)}
  .err{color:var(--bad)}
  a{color:var(--pri)}
</style>
</head>
<body>
<header>
  <div class="logo">Б</div>
  <div class="who"><b id="who">Белес маркетинг</b><small id="whoRole">Жүктелуде…</small></div>
  <a id="sheetLink" target="_blank" style="display:none">Кестені ашу ↗</a>
</header>
<main id="app"><div class="center">Жүктелуде…</div></main>
<div id="toast"></div>

<script>
var S = { key:'', init:null, date:'', block:'', day:null, tab:'sum' };
var ROLE_KZ = { boss:'Бастық', target:'Таргетолог', callcenter:'Колл-центр', reception:'Ресепшн' };
var $ = function(id){ return document.getElementById(id); };

function call(fn){
  var args = Array.prototype.slice.call(arguments,1);
  return new Promise(function(res,rej){
    var r = google.script.run.withSuccessHandler(res).withFailureHandler(function(e){ rej(e && e.message ? e.message : String(e)); });
    r[fn].apply(r,args);
  });
}
function toast(t){ var e=$('toast'); e.textContent=t; e.style.display='block'; clearTimeout(e._t); e._t=setTimeout(function(){e.style.display='none';},2500); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
function num(v){ var n=parseFloat(String(v==null?'':v).replace(',','.')); return isNaN(n)?0:n; }
function fmt(n,d){ if(n===''||n==null||isNaN(n)) return '—'; return Number(n).toLocaleString('ru-RU',{maximumFractionDigits:d==null?2:d}); }
function money(n){ return (n===''||n==null)?'—':fmt(n,2); }
function pct(a,b){ return b? fmt(a/b*100,1)+'%' : '—'; }
function sum(a){ return (a||[]).reduce(function(s,v){return s+num(v);},0); }
function shiftDate(ds,k){ var p=ds.split('-'); var d=new Date(+p[0],+p[1]-1,+p[2]+k); return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2); }

google.script.url.getLocation(function(loc){
  S.key = (loc.parameter && loc.parameter.k) || '';
  call('apiInit', S.key).then(function(r){
    S.init = r; S.date = r.today;
    $('who').textContent = r.user.name;
    $('whoRole').textContent = ROLE_KZ[r.user.role] + (r.user.block && r.user.role!=='boss' ? ' · ' + r.user.block : '');
    if (r.user.role === 'boss') {
      S.block = (r.blocks[0]||{}).id || '';
      if (r.sheetUrl){ $('sheetLink').href=r.sheetUrl; $('sheetLink').style.display=''; }
      renderBoss();
    } else {
      S.block = r.user.block;
      renderEmployee();
    }
  }).catch(function(e){ $('app').innerHTML = '<div class="center err">'+esc(e)+'</div>'; $('whoRole').textContent=''; });
});

/* ---------------- Маман беті ---------------- */
function renderEmployee(){
  $('app').innerHTML = '<div id="entry"></div><div class="card"><div class="row" style="justify-content:space-between"><h2 style="margin:0">Айлық кесте</h2><input type="month" id="mon"></div><div id="month" class="tbl" style="margin-top:12px"></div></div>';
  $('mon').value = S.date.slice(0,7);
  $('mon').onchange = loadMonthBlock;
  renderEntry($('entry'));
  loadMonthBlock();
}

function renderEntry(box, withBlockSelect){
  var sel = '';
  if (withBlockSelect) {
    sel = '<select id="blk">' + S.init.blocks.map(function(b){ return '<option value="'+esc(b.id)+'"'+(b.id===S.block?' selected':'')+'>'+esc(b.id)+'</option>'; }).join('') + '</select>';
  }
  box.innerHTML = '<div class="card"><h2>Күнделікті мәлімет енгізу</h2><div class="row">'+sel+
    '<button id="prev">‹</button><input type="date" id="dt"><button id="next">›</button><button id="tod">Бүгін</button></div>'+
    '<div id="form"><div class="center">Жүктелуде…</div></div></div>';
  $('dt').value = S.date;
  $('dt').onchange = function(){ S.date = this.value; loadDay(); };
  $('prev').onclick = function(){ S.date = shiftDate(S.date,-1); $('dt').value=S.date; loadDay(); };
  $('next').onclick = function(){ S.date = shiftDate(S.date,1); $('dt').value=S.date; loadDay(); };
  $('tod').onclick = function(){ S.date = S.init.today; $('dt').value=S.date; loadDay(); };
  if (withBlockSelect) $('blk').onchange = function(){ S.block=this.value; loadDay(); };
  loadDay();
}

function loadDay(){
  var f = $('form'); if(!f) return;
  f.innerHTML = '<div class="center">Жүктелуде…</div>';
  call('apiGetDay', S.key, S.block, S.date).then(function(d){ S.day=d; drawForm(); }).catch(function(e){ f.innerHTML='<div class="center err">'+esc(e)+'</div>'; });
}

function drawForm(){
  var d = S.day, role = d.role, def = S.init.roles[role];
  if (!def) { $('form').innerHTML = '<div class="center err">Блок табылмады</div>'; return; }
  var prefilled = false;
  var html = '<div class="fields">';
  def.fields.forEach(function(f){
    if (d.available.indexOf(f.key) === -1) return;
    var v = d.values[f.key]; if (v===undefined) v='';
    if (role==='callcenter' && f.key==='leads' && v==='' && d.targetLeads!=='' && d.targetLeads!=null) { v = d.targetLeads; prefilled = true; }
    var calc = f.type==='calc';
    html += '<div class="f'+(calc?' calc':'')+'"><label>'+esc(f.kz)+'</label><input data-k="'+f.key+'" inputmode="decimal" '+(calc?'readonly tabindex="-1"':'')+' value="'+esc(v)+'" placeholder="0"></div>';
  });
  html += '</div><div id="hints"></div>';
  if (role==='callcenter') {
    html += '<div class="hint">🔗 Таргет осы күні: <b>'+(d.targetLeads===''||d.targetLeads==null?'әлі енгізілмеген':fmt(d.targetLeads)+' лид')+'</b>'+
      (d.targetSpend? ' · $'+money(d.targetSpend):'') + (prefilled?'<br>«Жаңа лидтер» таргеттен автоматты толтырылды — қажет болса түзетіңіз.':'')+'</div>';
  }
  html += '<button class="pri save" id="saveBtn">Сақтау</button>';
  $('form').innerHTML = html;
  Array.prototype.forEach.call(document.querySelectorAll('#form input:not([readonly])'), function(i){ i.oninput = recalc; });
  $('saveBtn').onclick = save;
  recalc();
}

function vals(){ var o={}; Array.prototype.forEach.call(document.querySelectorAll('#form input[data-k]'), function(i){ o[i.dataset.k]=i.value.trim(); }); return o; }
function setCalc(k,v){ var i=document.querySelector('#form input[data-k="'+k+'"]'); if(i) i.value=v; }

function recalc(){
  var v = vals(), role = S.day.role, h = '';
  if (role==='target') {
    setCalc('cpl', num(v.leads)? (num(v.spend)/num(v.leads)).toFixed(2) : '');
  } else if (role==='callcenter') {
    setCalc('conv', num(v.leads)? (num(v.booked)/num(v.leads)*100).toFixed(1) : '');
    var s = num(v.booked)+num(v.noanswer)+num(v.inwork)+num(v.refused);
    if (v.leads!=='') {
      h = s===num(v.leads) ? '<div class="hint ok">✓ Барлық лидтер бөлінді ('+s+' / '+num(v.leads)+')</div>'
        : '<div class="hint warn">Жазылды + недозвон + жұмыста + отказ = '+s+', ал жаңа лидтер = '+num(v.leads)+'</div>';
    }
  } else if (role==='reception') {
    setCalc('total', (num(v.cash)+num(v.card)+num(v.transfer)) || '');
    if (v.came!=='' && v.consult!=='' && num(v.came)>num(v.consult)) h += '<div class="hint warn">«Келді» саны консультациядан көп</div>';
    if (v.bought!=='' && v.came!=='' && num(v.bought)>num(v.came)) h += '<div class="hint warn">«Сатып алды» саны «Келді»-ден көп</div>';
  }
  $('hints').innerHTML = h;
}

function save(){
  var b = $('saveBtn'); b.disabled = true; b.textContent = 'Сақталуда…';
  var v = vals();
  var def = S.init.roles[S.day.role];
  def.fields.forEach(function(f){ if (f.type==='calc') delete v[f.key]; });
  call('apiSaveDay', S.key, S.block, S.date, v).then(function(d){
    S.day = d; drawForm(); toast('✓ Кестеге сақталды');
    if ($('mon')) loadMonthBlock();
  }).catch(function(e){ b.disabled=false; b.textContent='Сақтау'; toast('Қате: '+e); });
}

function loadMonthBlock(){
  var box=$('month'); if(!box) return;
  box.innerHTML='<div class="center">Жүктелуде…</div>';
  call('apiGetMonthBlock', S.key, S.block, $('mon').value).then(function(r){
    var def = S.init.roles[r.role];
    var keys = def.fields.filter(function(f){ return r.rows[f.key]; });
    if (!keys.length){ box.innerHTML='<div class="center">Бұл айда мәлімет жоқ</div>'; return; }
    var ym = $('mon').value, todayD = S.init.today.slice(0,7)===ym ? +S.init.today.slice(8) : 0;
    var h = '<table><tr><th>Күн</th>'+keys.map(function(f){return '<th>'+esc(f.kz)+'</th>';}).join('')+'</tr>';
    for (var i=0;i<r.days;i++){
      h += '<tr><td'+(i+1===todayD?' class="today"':'')+'>'+('0'+(i+1)).slice(-2)+'.'+ym.slice(5)+'</td>'+keys.map(function(f){ var x=r.rows[f.key][i]; return '<td>'+(x===''?'':fmt(x))+'</td>'; }).join('')+'</tr>';
    }
    h += '<tr class="tot"><td>Барлығы</td>'+keys.map(function(f){
      var a=r.rows[f.key];
      if (f.key==='cpl') return '<td>'+money(sum(r.rows.leads)? sum(r.rows.spend)/sum(r.rows.leads):'')+'</td>';
      if (f.key==='conv') return '<td>'+pct(sum(r.rows.booked),sum(r.rows.leads))+'</td>';
      return '<td>'+fmt(sum(a))+'</td>'; }).join('')+'</tr></table>';
    box.innerHTML = h;
  }).catch(function(e){ box.innerHTML='<div class="center err">'+esc(e)+'</div>'; });
}

/* ---------------- Бастық беті ---------------- */
function renderBoss(){
  var tabs = [['sum','📊 Жалпы есеп'],['entry','✏️ Енгізу / түзету'],['log','🕑 Журнал'],['links','🔗 Сілтемелер']];
  $('app').innerHTML = '<div class="tabs">'+tabs.map(function(t){ return '<button data-t="'+t[0]+'"'+(S.tab===t[0]?' class="on"':'')+'>'+t[1]+'</button>'; }).join('')+'</div><div id="tab"></div>';
  Array.prototype.forEach.call(document.querySelectorAll('.tabs button'), function(b){ b.onclick=function(){ S.tab=b.dataset.t; renderBoss(); }; });
  var box = $('tab');
  if (S.tab==='sum') renderSummary(box);
  else if (S.tab==='entry') renderEntry(box, true);
  else if (S.tab==='log') renderLog(box);
  else renderLinks(box);
}

function renderSummary(box){
  box.innerHTML = '<div class="card"><div class="row" style="justify-content:space-between"><h2 style="margin:0">Айлық есеп</h2><input type="month" id="smon"></div><div id="sum"><div class="center">Жүктелуде…</div></div></div>';
  $('smon').value = S.smon || S.init.today.slice(0,7);
  $('smon').onchange = function(){ S.smon=this.value; loadSummary(); };
  loadSummary();
}

function loadSummary(){
  var ym = $('smon').value;
  call('apiGetSummary', S.key, ym).then(function(r){ drawSummary(r, ym); }).catch(function(e){ $('sum').innerHTML='<div class="center err">'+esc(e)+'</div>'; });
}

function agg(blocks, role, key, days){
  var out=[]; for(var i=0;i<days;i++) out.push(0);
  blocks.filter(function(b){return b.role===role && b.rows[key];}).forEach(function(b){ b.rows[key].forEach(function(v,i){ out[i]+=num(v); }); });
  return out;
}

function kpi(label, val, sub){ return '<div class="kpi"><small>'+label+'</small><b>'+val+'</b>'+(sub?'<br><i>'+sub+'</i>':'')+'</div>'; }

function drawSummary(r, ym){
  if (!r.sheetName){ $('sum').innerHTML='<div class="center">Бұл айдың парағы әлі жоқ. Бірінші мәлімет енгізілгенде автоматты жасалады.</div>'; return; }
  var B=r.blocks, D=r.days, A=function(role,k){ return agg(B,role,k,D); };
  var leads=A('target','leads'), spend=A('target','spend');
  var ccLeads=A('callcenter','leads'), booked=A('callcenter','booked'), noans=A('callcenter','noanswer'), inwork=A('callcenter','inwork'), ccRef=A('callcenter','refused');
  var consult=A('reception','consult'), came=A('reception','came'), bought=A('reception','bought'), think=A('reception','thinking'), rRef=A('reception','refused');
  var cash=A('reception','cash'), card=A('reception','card'), tr=A('reception','transfer');
  var kassa=cash.map(function(v,i){return v+card[i]+tr[i];});
  // Касса общая жолы бар, бірақ нал/безнал бос болса — сол жолды қолданамыз
  var kTot=A('reception','total'); if (sum(kassa)===0 && sum(kTot)>0) kassa=kTot;
  var L=sum(leads), Sp=sum(spend), Bk=sum(booked), Cm=sum(came), Bt=sum(bought), K=sum(kassa);

  var h = '<div class="sec">Таргет</div><div class="kpis">'+
    kpi('Лидтер', fmt(L,0))+kpi('Жұмсалды', '$'+money(Sp))+kpi('Орташа лид бағасы', L?'$'+money(Sp/L):'—')+
    kpi('Бір сатылым бағасы', Bt?'$'+money(Sp/Bt):'—','жарнама / сатып алғандар')+'</div>';
  h += '<div class="sec">Колл-центр</div><div class="kpis">'+
    kpi('Жаңа лидтер', fmt(sum(ccLeads),0), 'таргетте: '+fmt(L,0))+kpi('Жазылды', fmt(Bk,0), 'конверсия '+pct(Bk,sum(ccLeads)))+
    kpi('Недозвон', fmt(sum(noans),0))+kpi('Жұмыста', fmt(sum(inwork),0))+kpi('Бас тартты', fmt(sum(ccRef),0))+'</div>';
  h += '<div class="sec">Ресепшн</div><div class="kpis">'+
    kpi('Консультациялар', fmt(sum(consult),0))+kpi('Келді', fmt(Cm,0), pct(Cm,sum(consult))+' консультациядан')+
    kpi('Сатып алды', fmt(Bt,0), pct(Bt,Cm)+' келгендерден')+kpi('Ойланып жүр', fmt(sum(think),0))+kpi('Бас тартты', fmt(sum(rRef),0))+'</div>';
  h += '<div class="sec">Касса</div><div class="kpis">'+
    kpi('Жалпы касса', fmt(K))+kpi('Қолма-қол', fmt(sum(cash)))+kpi('Карта (безнал)', fmt(sum(card)))+kpi('Аударым', fmt(sum(tr)))+
    kpi('Орташа чек', Bt?fmt(K/Bt):'—')+'</div>';

  var fl=[['Лид',L],['Жазылды',Bk],['Келді',Cm],['Сатып алды',Bt]], mx=Math.max(1,L,Bk,Cm,Bt);
  h += '<div class="sec">Воронка</div><div class="funnel">'+fl.map(function(x,i){
    return '<div class="fn"><span>'+x[0]+'</span><div class="bar" style="width:'+Math.max(6,x[1]/mx*100)+'%">'+fmt(x[1],0)+(i?' · '+pct(x[1],fl[i-1][1]):'')+'</div></div>'; }).join('')+'</div>';

  var todayD = S.init.today.slice(0,7)===ym ? +S.init.today.slice(8) : 0;
  h += '<div class="sec">Күндер бойынша</div><div class="tbl"><table><tr><th>Күн</th><th>Лид</th><th>$ сома</th><th>$ / лид</th><th>КЦ лид</th><th>Жазылды</th><th>Конс.</th><th>Келді</th><th>Сатты</th><th>Касса</th></tr>';
  for (var i=0;i<D;i++){
    h += '<tr><td'+(i+1===todayD?' class="today"':'')+'>'+('0'+(i+1)).slice(-2)+'.'+ym.slice(5)+'</td><td>'+z(leads[i])+'</td><td>'+z(spend[i],1)+'</td><td>'+(leads[i]?money(spend[i]/leads[i]):'')+'</td><td>'+z(ccLeads[i])+'</td><td>'+z(booked[i])+'</td><td>'+z(consult[i])+'</td><td>'+z(came[i])+'</td><td>'+z(bought[i])+'</td><td>'+z(kassa[i],1)+'</td></tr>';
  }
  h += '<tr class="tot"><td>Барлығы</td><td>'+fmt(L,0)+'</td><td>'+money(Sp)+'</td><td>'+(L?money(Sp/L):'—')+'</td><td>'+fmt(sum(ccLeads),0)+'</td><td>'+fmt(Bk,0)+'</td><td>'+fmt(sum(consult),0)+'</td><td>'+fmt(Cm,0)+'</td><td>'+fmt(Bt,0)+'</td><td>'+fmt(K)+'</td></tr></table></div>';

  // Блоктар бойынша (мыс. әр колл-центр операторы бөлек)
  var multi = B.filter(function(b){return b.role!=='target';});
  if (multi.length>2){
    h += '<div class="sec">Блоктар бойынша</div><div class="tbl"><table><tr><th>Блок</th><th>Лид / Конс.</th><th>Жазылды / Келді</th><th>Сатты</th><th>Касса</th></tr>';
    multi.forEach(function(b){
      if (b.role==='callcenter') h+='<tr><td>'+esc(b.id)+'</td><td>'+fmt(sum(b.rows.leads),0)+'</td><td>'+fmt(sum(b.rows.booked),0)+' ('+pct(sum(b.rows.booked),sum(b.rows.leads))+')</td><td></td><td></td></tr>';
      else { var kk = sum(b.rows.cash)+sum(b.rows.card)+sum(b.rows.transfer) || sum(b.rows.total);
        h+='<tr><td>'+esc(b.id)+'</td><td>'+fmt(sum(b.rows.consult),0)+'</td><td>'+fmt(sum(b.rows.came),0)+'</td><td>'+fmt(sum(b.rows.bought),0)+'</td><td>'+fmt(kk)+'</td></tr>'; }
    });
    h += '</table></div>';
  }
  $('sum').innerHTML = h;
}
function z(v,money){ return v ? (money? fmt(v,2) : fmt(v,0)) : ''; }

function renderLog(box){
  box.innerHTML='<div class="card"><h2>Соңғы өзгерістер</h2><div class="log" id="lg"><div class="center">Жүктелуде…</div></div></div>';
  call('apiGetLog', S.key).then(function(r){
    $('lg').innerHTML = r.length ? r.map(function(x){ return '<div><b>'+esc(x.name)+'</b> · '+esc(x.block)+' · '+esc(x.date)+' <small>('+esc(x.time)+')</small><br>'+esc(x.changes)+'</div>'; }).join('') : '<div class="center">Әзірге өзгеріс жоқ</div>';
  }).catch(function(e){ $('lg').innerHTML='<div class="center err">'+esc(e)+'</div>'; });
}

function renderLinks(box){
  box.innerHTML='<div class="card"><h2>Мамандардың жеке сілтемелері</h2><p style="color:var(--muted);margin-top:0">Әр маманға тек өз сілтемесін жіберіңіз. Жаңа маман қосу немесе сілтемені өзгерту — кестедегі «Доступ» парағында.</p><div class="links" id="lk"><div class="center">Жүктелуде…</div></div></div>';
  call('apiGetLinks', S.key).then(function(r){
    $('lk').innerHTML = r.map(function(u,i){ return '<div class="l"><div><b>'+esc(u.name)+'</b> · '+esc(ROLE_KZ[u.role]||u.role)+(u.block?' · '+esc(u.block):'')+'<small>'+esc(u.url)+'</small></div><button data-i="'+i+'">Көшіру</button></div>'; }).join('');
    Array.prototype.forEach.call(document.querySelectorAll('#lk button'), function(b){
      b.onclick=function(){ var u=r[+b.dataset.i].url;
        (navigator.clipboard? navigator.clipboard.writeText(u) : Promise.reject()).then(function(){toast('Көшірілді');}).catch(function(){ prompt('Сілтемені көшіріңіз:', u); }); };
    });
  }).catch(function(e){ $('lk').innerHTML='<div class="center err">'+esc(e)+'</div>'; });
}
</script>
