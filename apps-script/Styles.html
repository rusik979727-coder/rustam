<style>
  /* Ақ, жеңіл, медициналық, BELES логотипінің түстерімен: қою көк және көгілдір-жасыл.
     Кесте таблицадағыдай: жолдар мен бағандар, бір экранға көп сыяды. */
  :root {
    --bg: #f4f6f9;
    --surface: #ffffff;
    --ink: #122c43;
    --muted: #667085;
    --faint: #98a2b3;
    --line: #e4e8ee;
    --line-strong: #cfd6e0;
    --accent: #126d72;
    --accent-light: #22a9b1;
    --accent-ink: #ffffff;
    --accent-soft: #e5f2f2;
    --came: #1f8a4c;
    --came-soft: #e9f6ef;
    --missed: #c43c3c;
    --missed-soft: #fdeeee;
    --plasma: #6d4fc2;
    --plasma-soft: #f2eefc;
    --radius: 8px;
    --row-h: 40px;
    --time-w: 62px;
    --font: 'Golos Text', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
    --brand-font: 'Montserrat', 'Golos Text', system-ui, sans-serif;
    color-scheme: light;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 400 14.5px/1.4 var(--font); font-variant-numeric: tabular-nums;
  }
  button, input, select, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  [hidden] { display: none !important; }

  /* ── Жоғарғы панель ── */
  .top {
    position: sticky; top: 0; z-index: 5;
    background: var(--surface); border-bottom: 1px solid var(--line);
    padding: max(8px, env(safe-area-inset-top)) 16px 0;
  }
  .brand-row {
    display: flex; align-items: center; gap: 8px; max-width: 1280px; margin: 0 auto 8px;
  }
  .brand-mark { width: 30px; height: 30px; flex: none; display: block; }
  .brand-word { font: 700 19px/1 var(--brand-font); letter-spacing: .08em; }
  .brand-word .b1 { color: var(--ink); }
  .brand-word .b2 { color: var(--accent); }
  .brand-sub { font: 600 12.5px/1 var(--brand-font); color: var(--muted); padding-top: 2px; }
  .top-row { display: flex; align-items: center; gap: 4px; max-width: 1280px; margin: 0 auto; }
  .icon-btn {
    width: 36px; height: 36px; flex: none; border: 1px solid var(--line); border-radius: var(--radius);
    background: var(--surface); font-size: 20px; line-height: 1; color: var(--muted);
  }
  .icon-btn:hover { border-color: var(--line-strong); color: var(--ink); }
  .date-pick { position: relative; flex: 1; min-width: 0; display: flex; flex-direction: column; padding: 0 8px; cursor: pointer; }
  .date-main { font-size: 18px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .date-sub { font-size: 12.5px; color: var(--muted); }
  .date-pick input { position: absolute; inset: 0; opacity: 0; width: 100%; cursor: pointer; }
  .text-btn {
    flex: none; border: 1px solid var(--line-strong); background: var(--surface); color: var(--ink);
    border-radius: var(--radius); padding: 7px 12px; font-weight: 500; font-size: 14px;
  }
  .text-btn[aria-pressed="true"] { background: var(--accent-soft); border-color: transparent; color: var(--accent); }
  .tabs { display: flex; gap: 2px; max-width: 1280px; margin: 6px auto 0; overflow-x: auto; }
  .tabs button {
    flex: none; border: 0; background: transparent; color: var(--muted);
    padding: 9px 12px 10px; font-weight: 500; border-bottom: 2px solid transparent;
  }
  .tabs button[aria-selected="true"] { color: var(--accent); border-bottom-color: var(--accent); }

  main { max-width: 1280px; margin: 0 auto; padding: 14px 16px 96px; }

  /* ── Екі кесте ── */
  .board { display: grid; gap: 16px; }
  @media (min-width: 1000px) {
    .board { grid-template-columns: minmax(0, 1.75fr) minmax(0, 1fr); align-items: start; }
    .only-narrow { display: none; }
  }
  @media (max-width: 999px) {
    body[data-tab="schedule"] .col-physio { display: none; }
    body[data-tab="physio"] .col-doctor { display: none; }
  }
  .col-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin: 2px 2px 8px; }
  .col-head h2 { margin: 0; font-size: 15px; font-weight: 600; }
  .count { color: var(--muted); font-size: 13px; }

  .table { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
  .slots, .blocks { list-style: none; margin: 0; padding: 0; }
  .t-head {
    background: #f8fafc; border-bottom: 1px solid var(--line-strong);
    color: var(--muted); font-size: 12px; font-weight: 500;
  }
  .t-head > span, .t-head .d-fields > span { padding: 7px 10px; }
  .t-head > .d-fields { padding: 0; }
  .t-head { align-items: center; }

  /* Бағандар: уақыт | пациент, телефон, қызмет, қайдан, менеджер | келді */
  .d-cols { display: grid; grid-template-columns: var(--time-w) minmax(0, 1fr) 84px; align-items: stretch; }
  .d-fields { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(0, 1.15fr) minmax(0, .85fr) minmax(0, .75fr) minmax(0, .8fr); min-width: 0; }
  .t-att { display: flex; gap: 4px; align-items: center; justify-content: center; }

  .row { border-bottom: 1px solid var(--line); min-height: var(--row-h); scroll-margin-top: 140px; }
  .row:last-child { border-bottom: 0; }
  .c-time {
    display: flex; align-items: center; padding: 0 10px; font-weight: 600; font-size: 14px;
    border-right: 1px solid var(--line); color: var(--ink);
  }
  .row:not(.hour) .c-time { color: var(--muted); font-weight: 500; }

  .row button.d-fields {
    border: 0; background: transparent; text-align: left; padding: 0; align-items: center; min-height: var(--row-h);
  }
  .row button.d-fields > span { padding: 6px 10px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row button.d-fields:hover { background: #f8fafc; }
  .c-name { font-weight: 600; }
  .c-note { display: block; font-weight: 400; color: var(--muted); font-size: 12.5px; overflow: hidden; text-overflow: ellipsis; }
  .c-phone { color: var(--ink); }
  .c-tag { color: var(--muted); font-size: 13.5px; }
  .c-empty { color: var(--faint); font-size: 13.5px; }
  .c-empty small { font-size: 12.5px; }
  .row:not(.booked) button.d-fields { display: flex; }
  .row:not(.booked) button.d-fields:hover .c-empty { color: var(--accent); }

  .row.booked { background: var(--surface); }
  .row.booked .c-time { box-shadow: inset 3px 0 0 var(--accent); }
  .row.came { background: var(--came-soft); }
  .row.came .c-time { box-shadow: inset 3px 0 0 var(--came); }
  .row.missed { background: var(--missed-soft); }
  .row.missed .c-time { box-shadow: inset 3px 0 0 var(--missed); }
  .row.missed .c-name { text-decoration: line-through; text-decoration-color: rgba(196, 60, 60, .5); }
  .row.past:not(.booked) { background: #fafbfc; }

  .att {
    width: 32px; height: 28px; border-radius: 6px; border: 1px solid var(--line-strong);
    background: var(--surface); font-size: 14px; font-weight: 700; color: var(--faint); padding: 0;
  }
  .att.yes:hover { color: var(--came); border-color: var(--came); }
  .att.no:hover { color: var(--missed); border-color: var(--missed); }
  .att.yes[aria-pressed="true"] { background: var(--came); border-color: var(--came); color: #fff; }
  .att.no[aria-pressed="true"] { background: var(--missed); border-color: var(--missed); color: #fff; }

  /* Қазір */
  .row.now .c-time { color: var(--accent) !important; font-weight: 700; background: var(--accent-soft); }
  .row.now:not(.booked) { background: var(--accent-soft); }

  /* ── Ем кестесі: уақыт | 1-орын | 2-орын | 3-орын ── */
  .p-cols, .block { display: grid; grid-template-columns: var(--time-w) repeat(3, minmax(0, 1fr)); }
  .block .places { grid-column: 2 / -1; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .place {
    min-height: var(--row-h); border: 0; border-right: 1px solid var(--line); background: transparent;
    text-align: left; padding: 5px 8px; font-size: 13px; min-width: 0;
  }
  .place:nth-child(3n) { border-right: 0; }
  .place:nth-child(n+4) { border-top: 1px dashed var(--line); }
  .place:hover { background: #f8fafc; }
  .place:hover .c-empty { color: var(--accent); }
  .place b { display: block; font-weight: 600; font-size: 13.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .place small { display: block; color: var(--muted); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .place.taken { background: var(--accent-soft); }
  .place.taken.plasma { background: var(--plasma-soft); }
  .place.taken.plasma small { color: var(--plasma); font-weight: 500; }
  .place.extra { box-shadow: inset 0 0 0 1px #e8b04a; }
  .block.past .place:not(.taken) { background: #fafbfc; }

  /* ── Телефон: кесте ықшам, қосымша бағандар атының астына түседі ── */
  @media (max-width: 720px) {
    :root { --time-w: 54px; }
    .t-head .d-fields > span:not(:first-child) { display: none; }
    .d-fields { grid-template-columns: minmax(0, 1fr); }
    .row button.d-fields { display: block; padding: 6px 10px; }
    .row button.d-fields > span { display: inline; padding: 0; white-space: normal; }
    .row button.d-fields > .c-name { display: block; }
    .row button.d-fields > .c-phone::after, .row button.d-fields > .c-tag:not(:last-child)::after { content: ' · '; color: var(--faint); }
    .row button.d-fields > .c-tag:empty, .row button.d-fields > .c-phone:empty { display: none; }
    .row button.d-fields > .c-phone, .row button.d-fields > .c-tag { font-size: 12.5px; color: var(--muted); }
    .d-cols { grid-template-columns: var(--time-w) minmax(0, 1fr) 76px; }
    .att { width: 30px; height: 30px; }
    .place { padding: 5px 6px; }
  }

  /* ── Бос күй ── */
  .empty {
    background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
    padding: 28px 20px; text-align: center; margin-bottom: 16px;
  }
  .empty h3 { margin: 0 0 6px; font-size: 17px; }
  .empty p { margin: 0 auto 16px; color: var(--muted); max-width: 46ch; }

  /* ── Батырмалар ── */
  .primary, .ghost, .danger {
    border-radius: var(--radius); padding: 11px 18px; font-weight: 600; border: 1px solid transparent; min-height: 44px;
  }
  .primary { background: linear-gradient(135deg, var(--accent-light), var(--accent)); color: var(--accent-ink); }
  .primary:hover { filter: brightness(.95); }
  .primary:disabled { opacity: .5; cursor: wait; }
  .ghost { background: var(--surface); border-color: var(--line-strong); }
  .danger { background: transparent; color: var(--missed); }

  /* ── Диалогтар ── */
  dialog.sheet {
    border: 0; padding: 0; width: min(520px, 100%); max-height: 92vh;
    border-radius: 12px; background: var(--surface); color: var(--ink);
    box-shadow: 0 20px 50px rgba(16, 24, 40, .18);
  }
  dialog.sheet::backdrop { background: rgba(16, 24, 40, .35); }
  @media (max-width: 600px) {
    dialog.sheet { margin: auto 0 0; max-width: 100%; border-radius: 14px 14px 0 0; }
  }
  dialog.sheet > form, dialog.sheet > .sheet-head, dialog.sheet > .field, dialog.sheet > .free-slots { padding-left: 20px; padding-right: 20px; }
  dialog.sheet > form { padding-bottom: max(20px, env(safe-area-inset-bottom)); }
  .sheet-head { display: flex; align-items: center; justify-content: space-between; padding-top: 14px; }
  .sheet-head h3 { margin: 0; font-size: 17px; font-weight: 600; }
  .sheet-head .icon-btn { border: 0; font-size: 24px; }
  .field { display: block; border: 0; margin: 12px 0 0; padding: 0; min-width: 0; }
  .field > span, .field > legend { display: block; font-size: 12.5px; color: var(--muted); margin-bottom: 4px; padding: 0; font-weight: 500; }
  .field input, .field textarea, .field select {
    width: 100%; border: 1px solid var(--line-strong); border-radius: var(--radius); padding: 10px 12px;
    background: var(--surface); font-size: 16px;
  }
  .field input:focus, .field textarea:focus, .field select:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .field textarea { resize: vertical; }
  .with-actions { display: flex; gap: 10px; align-items: center; }
  .with-actions input { flex: 1; min-width: 0; }
  .mini-link { flex: none; font-size: 13.5px; color: var(--accent); font-weight: 500; }

  .seg { display: flex; flex-wrap: wrap; gap: 6px; }
  .seg button {
    border: 1px solid var(--line-strong); background: var(--surface); border-radius: var(--radius);
    padding: 7px 13px; min-height: 38px; font-size: 14.5px;
  }
  .seg button:hover { border-color: var(--accent); }
  .seg button[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); font-weight: 600; }
  .proc-other { margin-top: 8px; }
  .course-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .course-hint { margin: 10px 0 0; padding: 8px 10px; border-radius: var(--radius); background: var(--accent-soft); color: var(--ink); font-size: 13.5px; }
  .place .course { color: var(--accent); font-weight: 600; }
  .place.plasma .course { color: var(--plasma); }
  .sheet-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 18px; }
  .sheet-actions .primary { flex: 1 1 100%; }

  .free-slots { display: grid; grid-template-columns: repeat(auto-fill, minmax(72px, 1fr)); gap: 6px; padding-bottom: 20px; margin-top: 12px; }
  .free-slots button { border: 1px solid var(--line-strong); background: var(--surface); border-radius: var(--radius); padding: 9px 0; font-weight: 600; }
  .free-slots button:hover { background: var(--accent); border-color: var(--accent); color: #fff; }
  .free-slots p { grid-column: 1 / -1; color: var(--muted); margin: 0; }

  /* ── Іздеу ── */
  .search-box input {
    width: 100%; padding: 12px 14px; font-size: 16px; border: 1px solid var(--line-strong);
    border-radius: var(--radius); background: var(--surface);
  }
  .search-box input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .hint { color: var(--muted); }
  .results { list-style: none; padding: 0; margin: 0; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
  .results:empty { display: none; }
  .results li { border-bottom: 1px solid var(--line); }
  .results li:last-child { border-bottom: 0; }
  .results button {
    display: grid; grid-template-columns: 110px 1fr; gap: 12px; width: 100%; text-align: left;
    border: 0; background: transparent; padding: 10px 12px;
  }
  .results button:hover { background: #f8fafc; }
  .r-date { font-weight: 600; }
  .r-date small { display: block; font-weight: 400; color: var(--muted); }
  .r-name { font-weight: 600; }
  .r-meta { color: var(--muted); font-size: 13.5px; }
  .r-meta .missed { color: var(--missed); }
  .r-meta .came { color: var(--came); }

  /* ── Есеп ── */
  .period { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; margin-bottom: 16px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chips button { border: 1px solid var(--line-strong); background: var(--surface); border-radius: var(--radius); padding: 7px 13px; }
  .chips button[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); font-weight: 600; }
  .range { display: flex; gap: 8px; align-items: center; }
  .range input { border: 1px solid var(--line-strong); border-radius: var(--radius); padding: 7px 8px; background: var(--surface); }
  .kpis { display: flex; flex-wrap: wrap; gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; margin-bottom: 20px; }
  .kpi { flex: 1 1 140px; background: var(--surface); padding: 12px 14px; }
  .kpi b { display: block; font-size: 26px; font-weight: 700; line-height: 1.15; }
  .kpi span { color: var(--muted); font-size: 13px; }
  .breakdowns { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 16px; }
  .breakdown { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; }
  .breakdown h3 { margin: 0 0 8px; font-size: 14px; font-weight: 600; }
  .bar-row { display: grid; grid-template-columns: minmax(80px, 38%) 1fr 34px; gap: 8px; align-items: center; padding: 3px 0; font-size: 13.5px; }
  .bar-row .lbl { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .bar { height: 8px; border-radius: 4px; background: var(--accent); min-width: 2px; }
  .bar-row .n { text-align: right; font-weight: 600; }
  .days { margin-bottom: 16px; }
  .days-chart { display: flex; align-items: flex-end; gap: 3px; height: 110px; margin: 4px 0 6px; }
  .days-chart div { flex: 1; background: var(--accent); opacity: .85; border-radius: 3px 3px 0 0; min-height: 2px; }
  .days-legend { display: flex; justify-content: space-between; color: var(--muted); font-size: 12px; }

  /* ── Хабарлама ── */
  .toast {
    position: fixed; left: 50%; bottom: max(20px, env(safe-area-inset-bottom)); transform: translate(-50%, 150%);
    background: var(--ink); color: #fff; padding: 11px 16px; border-radius: var(--radius);
    max-width: calc(100% - 32px); transition: transform .2s ease; z-index: 20; font-size: 14px;
  }
  .toast.show { transform: translate(-50%, 0); }
  .toast.error { background: var(--missed); }

  .loading { opacity: .6; pointer-events: none; transition: opacity .15s; }

  @media (prefers-reduced-motion: reduce) {
    .toast { transition: none; }
  }
</style>
