<style>
/* Layout: phone-first lead desk — header, tabs, a working list; a lead opens as a full-height card on top. */
[hidden]{display:none!important}
:root{

}
@media (prefers-color-scheme: dark){:root{
  --bg:#0D1412; --surface:#151E1B; --sunk:#1B2622; --ink:#E5EDEA; --muted:#93A39E; --line:#27332F;

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;

.app{max-width:900px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
#view{display:flex;flex-direction:column;gap:14px}
button,select,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.top{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;justify-content:space-between}

select,.btn{height:40px;border-radius:10px;border:1px solid var(--line);background:var(--surface);padding:0 12px;cursor:pointer}

.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700}
.btn.wa{background:var(--wa);border-color:var(--wa);color:#fff;font-weight:700;text-decoration:none;display:inline-flex;align-items:center}

.lang{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;height:40px}
.lang button{border:0;background:var(--surface);padding:0 10px;font-weight:700;font-size:12.5px;cursor:pointer;color:var(--muted)}

.tabs{display:flex;gap:4px;background:var(--sunk);padding:4px;border-radius:12px;overflow-x:auto}
.tabs a{flex:1 0 auto;text-align:center;padding:9px 12px;border-radius:9px;color:var(--muted);text-decoration:none;font-weight:600;font-size:14px;white-space:nowrap}

.label{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.sub{color:var(--muted);font-size:13px}

.bar-tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

.s-new{background:var(--accent-soft);color:var(--accent)}
.s-noans,.s-noshow{background:var(--warn-soft);color:var(--warn)}

.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field.wide{grid-column:1 / -1}
.field label{font-size:13px;font-weight:600;color:var(--muted)}
.field input,.field select,.field textarea{min-height:44px;border-radius:10px;border:1px solid var(--line);background:var(--surface);padding:8px 12px;width:100%}
.field textarea{min-height:80px;resize:vertical}

.status-grid{display:flex;flex-wrap:wrap;gap:6px}
.status-grid button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 13px;cursor:pointer;font-weight:600;font-size:14px}
.status-grid button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.quick{display:flex;gap:6px;flex-wrap:wrap}
.quick button{border:1px dashed var(--line);background:none;border-radius:8px;padding:5px 10px;font-size:13px;cursor:pointer;color:var(--muted);font-weight:600}
.hist{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px;font-size:13.5px}
.hist li{padding:8px 10px;border-radius:8px;background:var(--surface);border:1px solid var(--line)}
.hist time{display:block;font-size:12px;color:var(--muted);font-weight:600}
.msg{font-size:14px}
.msg.err{color:var(--bad);font-weight:600}
.notice{padding:10px 12px;border-radius:10px;background:var(--warn-soft);font-size:14px}
.state{padding:24px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);display:flex;flex-direction:column;gap:10px;align-items:flex-start}
.state p{margin:0;color:var(--muted)}
.skeleton{height:72px;border-radius:var(--r);background:linear-gradient(90deg,var(--sunk),var(--surface),var(--sunk));background-size:200% 100%;animation:sh 1.4s linear infinite}
@keyframes sh{to{background-position:-200% 0}}
@media (prefers-reduced-motion:reduce){.skeleton{animation:none}}
#toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;z-index:40;max-width:calc(100% - 32px)}
</style>
</head>

const parseDT = s => s ? new Date(String(s).replace(" ","T")) : null;
const dayKey = s => String(s||"").slice(0,10);
const todayKey = () => fmtDT(new Date()).slice(0,10);
function human(s){ if(!s) return ""; const d=parseDT(s); if(isNaN(d)) return s; const tk=todayKey(), k=dayKey(s);
  const tm=`${pad(d.getHours())}:${pad(d.getMinutes())}`; if(k===tk) return (LANG==="ru"?"сегодня ":"бүгін ")+tm;

function chrome(){
  document.documentElement.lang = LANG;
  document.querySelectorAll(".lang button").forEach(b=>b.setAttribute("aria-pressed", b.dataset.lang===LANG));
  document.querySelectorAll(".tabs a").forEach(a=>{ a.textContent=t("tabs")[a.dataset.v]; a.setAttribute("aria-current", a.dataset.v===route()?"page":"false"); });
  $("#reload").textContent = t("reload"); $("#fab").textContent = t("add");
  $("#who").textContent = S.me ? (S.boss ? `${S.me} · ${LANG==="ru"?"все лиды":"барлық лидтер"}` : S.me) : "";
  $("#fab").hidden = !S.loaded || route()!=="lidter";
}
function render(){
  chrome();
  const el = $("#view");
  if (S.err && !S.loaded){ el.innerHTML = `<div class="state"><h2>${esc(t("err"))}</h2><p>${esc(S.err)}</p><button class="btn primary" id="retry" type="button">${esc(t("reload"))}</button></div>`; $("#retry").onclick=load; return; }
  if (!S.loaded) return;
  const v = route();
  if (v==="lidter"){ el.innerHTML = viewList(); bindList(); }
  if (v==="esep"){ el.innerHTML = viewReport(); bindReport(); }
  if (v==="taldau"){ el.innerHTML = viewStats(); bindStats(); }
}

/* ---------- лидтер ---------- */
function scoped(){ return S.leads.filter(l => !S.mgr || l.manager===S.mgr); }
function rowHtml(l){
  const due = isDue(l);
  const meta = [l.source, S.boss && l.manager, l.service].filter(Boolean).map(esc);
  if (l.status==="Жазылды" && l.appt) meta.push(`${esc(t("appt"))}: ${esc(human(l.appt))}`);
  else if (l.nextCall && OPEN.includes(l.status)) meta.push(`<span class="${due?"due":""}">${esc(t("next"))}: ${esc(human(l.nextCall))}</span>`);
  meta.push(`${esc(t("created"))}: ${esc(human(l.created))}`);
  return `<button type="button" class="row" data-id="${esc(l.id)}"><span class="nm">${esc(l.name || phoneFmt(l.phone))}</span><span class="pill ${ST_CLASS[l.status]||""}">${esc(stName(l.status))}</span>
    <span class="meta">${l.name?`<span class="num">${esc(phoneFmt(l.phone))}</span>`:""}${meta.map(m=>`<span>${m}</span>`).join("")}</span></button>`;
}
function viewList(){
  const base = scoped();
  const q = S.q.trim().toLowerCase(), qd = q.replace(/\D/g,"");
  let list = base.filter(l => S.filter==="all" || l.status===S.filter);
  if (q) list = list.filter(l => (l.name||"").toLowerCase().includes(q) || (qd && l.phone.includes(qd)));
  list.sort((a,b) => (b.updated||b.created).localeCompare(a.updated||a.created));
  const due = base.filter(isDue).sort((a,b)=>a.nextCall.localeCompare(b.nextCall));
  const counts = {}; base.forEach(l=>counts[l.status]=(counts[l.status]||0)+1);
  const chips = `<button type="button" class="chip" data-f="all" aria-pressed="${S.filter==="all"}">${esc(t("all"))}<b>${base.length}</b></button>` +
    ST.filter(s=>counts[s]).map(s=>`<button type="button" class="chip" data-f="${esc(s)}" aria-pressed="${S.filter===s}">${esc(stName(s))}<b>${counts[s]}</b></button>`).join("");
  const mgrSel = S.boss && S.managers.length>1 ? `<select id="mgr" aria-label="${esc(t("manager"))}"><option value="">${esc(t("allm"))}</option>${S.managers.map(m=>`<option ${m===S.mgr?"selected":""}>${esc(m)}</option>`).join("")}</select>` : "";
  const dueHtml = due.length && !q && S.filter==="all" ? `<section class="panel"><div class="panel-head"><h2>${esc(t("due"))} · ${due.length}</h2><span class="sub">${esc(t("due_sub"))}</span></div><div class="list">${due.map(rowHtml).join("")}</div></section>` : "";
  const body = !base.length ? `<div class="list"><div class="empty"><b>${esc(t("none"))}</b><br>${esc(t("none_hint"))}</div></div>`
    : list.length ? `<div class="list">${list.map(rowHtml).join("")}</div>` : `<div class="list"><div class="empty">${esc(t("nofound"))}</div></div>`;
  return `<div class="bar-tools"><input class="search" id="q" type="search" placeholder="${esc(t("search"))}" value="${esc(S.q)}" autocomplete="off">${mgrSel}</div>
    <div class="chips" id="chips">${chips}</div>${dueHtml}${body}`;
}
function bindList(){
  const q=$("#q"); q.oninput = () => { S.q=q.value; const pos=q.selectionStart; render(); const n=$("#q"); n.focus(); try{n.setSelectionRange(pos,pos);}catch{} };
  $("#chips").onclick = e => { const b=e.target.closest(".chip"); if(!b) return; S.filter=b.dataset.f; render(); };
  const m=$("#mgr"); if(m) m.onchange = () => { S.mgr=m.value; render(); };
  $("#view").querySelectorAll(".row").forEach(r => r.onclick = () => openLead(r.dataset.id));
}

/* ---------- карточка ---------- */
function openLead(id){
  const l = id ? S.leads.find(x=>x.id===id) : null;
  if (id && !l) return;
  S.open = l ? Object.assign({}, l) : {id:"", name:"", phone:"", source:"", service:"", status:"Жаңа", nextCall:"", appt:"", note:"", manager:S.me, history:""};
  renderCard();
}
const toLocal = s => s ? s.replace(" ","T") : "";
const fromLocal = s => s ? s.replace("T"," ").slice(0,16) : "";
function renderCard(){
  const l = S.open, isNew = !l.id, sh = $("#sheet");
  const digits = String(l.phone||"").replace(/\D/g,"");
  const opt = (arr, v) => { const a = arr.slice(); if (v && !a.includes(v)) a.unshift(v); return `<option value=""></option>` + a.map(x=>`<option ${x===v?"selected":""}>${esc(x)}</option>`).join(""); };
  const hist = (l.history||"").split("\n").filter(Boolean).reverse().map(line=>{ const p=line.split(" · "); return `<li><time>${esc(p[0])} · ${esc(p[1]||"")}</time>${esc(p.slice(2).join(" · "))}</li>`; }).join("");
  sh.innerHTML = `<div class="card" role="dialog" aria-modal="true" aria-labelledby="cardTitle">
    <div class="card-head"><div><span class="label">${esc(isNew ? t("new_t") : stName(l.status))}</span><h2 id="cardTitle">${esc(isNew ? t("new_t") : (l.name || phoneFmt(l.phone)))}</h2>${isNew?"":`<span class="sub num">${esc(phoneFmt(l.phone))}</span>`}</div>
      <button class="x" type="button" id="close" aria-label="Жабу">×</button></div>
    ${isNew || !digits ? "" : `<div class="contact"><a class="btn wa" href="https://wa.me/${digits}" target="_blank" rel="noopener">${esc(t("wa"))}</a><a class="btn" href="tel:+${digits}">${esc(t("call"))}</a></div>`}
    <form id="leadForm" class="panel" autocomplete="off">
      <div class="fields">
        <div class="field"><label for="f_name">${esc(t("name"))}</label><input id="f_name" value="${esc(l.name)}" maxlength="100"></div>
        <div class="field"><label for="f_phone">${esc(t("phone"))}</label><input id="f_phone" type="tel" inputmode="tel" value="${esc(l.phone?phoneFmt(l.phone):"")}" placeholder="+7 701 123 45 67"></div>
        <div class="field"><label for="f_source">${esc(t("source"))}</label><select id="f_source">${opt(S.sources, l.source)}</select></div>
        <div class="field"><label for="f_service">${esc(t("service"))}</label><input id="f_service" list="svc" value="${esc(l.service)}" maxlength="100"><datalist id="svc">${S.services.map(s=>`<option>${esc(s)}</option>`).join("")}</datalist></div>
        ${S.boss && S.managers.length>1 ? `<div class="field"><label for="f_manager">${esc(t("manager"))}</label><select id="f_manager">${S.managers.map(m=>`<option ${m===l.manager?"selected":""}>${esc(m)}</option>`).join("")}</select></div>` : ""}
        <div class="field wide"><label>${esc(t("status"))}</label><div class="status-grid" id="stGrid">${ST.map(s=>`<button type="button" data-s="${esc(s)}" aria-pressed="${s===l.status}">${esc(stName(s))}</button>`).join("")}</div></div>
        <div class="field" id="wrapNext"><label for="f_next">${esc(t("nextCall"))}</label><input id="f_next" type="datetime-local" value="${esc(toLocal(l.nextCall))}">
          <div class="quick" id="quick"><button type="button" data-q="h2">${esc(t("q").h2)}</button><button type="button" data-q="tom">${esc(t("q").tom)}</button><button type="button" data-q="d3">${esc(t("q").d3)}</button><button type="button" data-q="clr">${esc(t("q").clr)}</button></div></div>
        <div class="field" id="wrapAppt"><label for="f_appt">${esc(t("apptF"))}</label><input id="f_appt" type="datetime-local" value="${esc(toLocal(l.appt))}"></div>
        <div class="field wide"><label for="f_note">${esc(t("note"))}</label><textarea id="f_note" maxlength="2000">${esc(l.note)}</textarea></div>
        ${isNew ? "" : `<div class="field wide"><label for="f_comment">${esc(t("comment"))}</label><input id="f_comment" maxlength="1000" placeholder="${esc(t("comment_ph"))}"></div>`}
      </div>
      <div class="bar-tools"><button class="btn primary" type="submit" id="saveLead">${esc(t("save"))}</button><span class="msg" id="leadMsg"></span></div>
    </form>
    ${hist ? `<section class="panel"><h2>${esc(t("hist"))}</h2><ul class="hist">${hist}</ul></section>` : ""}
  </div>`;
  sh.hidden = false; document.body.style.overflow = "hidden";
  const close = () => { sh.hidden = true; sh.innerHTML = ""; document.body.style.overflow = ""; S.open = null; };
  $("#close").onclick = close;
  sh.onclick = e => { if (e.target === sh) close(); };
  document.onkeydown = e => { if (e.key==="Escape" && !sh.hidden) close(); };
  const syncVis = () => { $("#wrapAppt").hidden = !BOOKED.includes(l.status) && !$("#f_appt").value; };
  syncVis();
  $("#stGrid").onclick = e => { const b=e.target.closest("button"); if(!b) return; l.status=b.dataset.s; $("#stGrid").querySelectorAll("button").forEach(x=>x.setAttribute("aria-pressed", x===b)); syncVis(); };
  $("#quick").onclick = e => { const b=e.target.closest("button"); if(!b) return; const d=new Date();
    if(b.dataset.q==="h2") d.setHours(d.getHours()+2); if(b.dataset.q==="tom"){ d.setDate(d.getDate()+1); d.setHours(10,0,0,0); } if(b.dataset.q==="d3"){ d.setDate(d.getDate()+3); d.setHours(10,0,0,0); }
    $("#f_next").value = b.dataset.q==="clr" ? "" : fmtDT(d).replace(" ","T"); };
  (isNew ? $("#f_phone") : null)?.focus();
  $("#leadForm").onsubmit = async e => {
    e.preventDefault();
    const msg = $("#leadMsg"), btn = $("#saveLead");
    const input = { id:l.id||undefined, name:$("#f_name").value, phone:$("#f_phone").value, source:$("#f_source").value, service:$("#f_service").value,
      status:l.status, nextCall:fromLocal($("#f_next").value), appt:fromLocal($("#f_appt").value), note:$("#f_note").value };
    if ($("#f_manager")) input.manager = $("#f_manager").value;
    if ($("#f_comment")) input.comment = $("#f_comment").value;
    if (!input.phone.replace(/\D/g,"")){ msg.className="msg err"; msg.textContent=t("phoneBad"); return; }
    btn.disabled = true; msg.className="msg"; msg.textContent=t("saving");
    try {
      const r = await gs("crmSave", KEY, input);
      if (r.duplicate){
        btn.disabled = false;
        if (r.lead){ upsert(r.lead); S.open = Object.assign({}, r.lead); renderCard(); toast(t("dup")); }
        else { msg.className="msg err"; msg.textContent=t("dupOther")(r.other); }
        return;
      }
      upsert(r.lead); close(); toast(t("saved")); render();
    } catch(err){ btn.disabled=false; msg.className="msg err"; msg.textContent = t("saveErr") + " " + String((err && err.message) || err); }
  };
}
function upsert(lead){ const i=S.leads.findIndex(x=>x.id===lead.id); if(i>=0) S.leads[i]=lead; else S.leads.unshift(lead); }

/* ---------- бүгінгі есеп ---------- */
function dayCounts(leads, day){
  const ls = leads.filter(l => dayKey(l.created)===day);
  const n = s => ls.filter(l => s.includes(l.status)).length;
  const booked = n(BOOKED);
  return [ls.length, booked, n(["Жауап бермеді"]), n(["Жаңа","Ойланып жүр"]), n(["Бас тартты"]), ls.length ? booked/ls.length*100 : null];
}
function viewReport(){
  const day = S.repDay || todayKey();
  const groups = S.boss ? S.managers.map(m=>[m, S.leads.filter(l=>l.manager===m)]) : [[S.me, S.leads]];
  if (S.boss && S.managers.length>1) groups.push([LANG==="ru"?"Всего":"Барлығы", S.leads]);
  const lab = t("r"), labK = t("r_kk");
  const head = `<tr><th></th>${groups.map(g=>`<th>${esc(g[0])}</th>`).join("")}</tr>`;
  const cols = groups.map(g=>dayCounts(g[1], day));
  const body = lab.map((x,i)=>`<tr><td>${esc(LANG==="ru"?x:labK[i])}${LANG==="ru"?"":`<br><span class="sub">${esc(x)}</span>`}</td>${cols.map(c=>`<td>${i===5?(c[5]==null?"—":nf1.format(c[5])+"%"):nf0.format(c[i])}</td>`).join("")}</tr>`).join("");
  const d = day.split("-");
  const txt = groups.map((g,gi)=>`Белес CRM — ${d[2]}.${d[1]} — ${g[0]}\n` + lab.map((x,i)=>`${x}: ${i===5?(cols[gi][5]==null?"—":nf1.format(cols[gi][5])+"%"):cols[gi][i]}`).join("\n")).join("\n\n");
  return `<section class="panel"><div class="panel-head"><h2>${esc(t("rep"))}</h2><span class="sub">${esc(t("rep_sub"))}</span></div>
    <div class="bar-tools"><label class="sub" for="repDay">${esc(t("day"))}</label><input class="search" style="flex:0 1 200px" id="repDay" type="date" value="${esc(day)}"></div>
    <div class="scroll"><table><thead>${head}</thead><tbody>${body}</tbody></table></div></section>
    <section class="panel"><div class="bar-tools"><button class="btn primary" id="copy" type="button">${esc(t("copy"))}</button></div><textarea class="report" id="repTxt" readonly>${esc(txt)}</textarea></section>`;
}
function bindReport(){
  $("#repDay").onchange = e => { S.repDay = e.target.value || null; render(); };
  $("#copy").onclick = () => { const ta=$("#repTxt"); const fb=()=>{ ta.focus(); ta.select(); toast(t("copyfail")); };
    try { navigator.clipboard.writeText(ta.value).then(()=>toast(t("copied")), fb); } catch { fb(); } };
}

/* ---------- талдау ---------- */
function viewStats(){
  let ls = scoped();
  if (S.period){ const from=new Date(); from.setDate(from.getDate()-S.period+1); const fk=fmtDT(from).slice(0,10); ls = ls.filter(l=>dayKey(l.created)>=fk); }
  const c = s => ls.filter(l=>s.includes(l.status)).length;
  const leads=ls.length, booked=c(BOOKED), came=c(["Келді","Сатып алды"]), bought=c(["Сатып алды"]), open=c(OPEN), overdue=ls.filter(isDue).length;
  const k = t("k");
  const tiles = [[k[0],nf0.format(leads)],[k[1],nf0.format(booked)],[k[2],leads?nf1.format(booked/leads*100)+"%":"—"],[k[3],nf0.format(bought)],[k[4],nf0.format(open)],[k[5],nf0.format(overdue)]];
  const steps = [[t("f")[0],leads],[t("f")[1],booked],[t("f")[2],came],[t("f")[3],bought]];
  const fun = steps.map(([lab,v],i)=>{ const prev=i?steps[i-1][1]:null; const w=leads?Math.max(v?2:0,v/leads*100):0;
    return `<div class="fstep"><span>${esc(lab)}</span><span class="v num">${nf0.format(v)}${i&&prev?`<span class="pct">${nf1.format(v/prev*100)}% ${esc(t("ofprev"))}</span>`:""}</span><div class="bar"><i style="width:${w}%"></i></div></div>`; }).join("");
  const group = key => { const m={}; ls.forEach(l=>{ const g=l[key]||"—"; (m[g]=m[g]||[]).push(l); });
    return Object.entries(m).sort((a,b)=>b[1].length-a[1].length).map(([g,arr])=>{ const n=s=>arr.filter(l=>s.includes(l.status)).length; const b=n(["Сатып алды"]);
      return `<tr><td>${esc(g)}</td><td>${arr.length}</td><td>${n(BOOKED)}</td><td>${n(["Келді","Сатып алды"])}</td><td>${b}</td><td>${arr.length?nf1.format(b/arr.length*100)+"%":"—"}</td></tr>`; }).join(""); };
  const th = `<thead><tr><th></th><th>${esc(t("leads"))}</th><th>${esc(t("booked"))}</th><th>${esc(t("came"))}</th><th>${esc(t("bought"))}</th><th>${esc(t("conv"))}</th></tr></thead>`;
  const per = [[7,t("p7")],[30,t("p30")],[0,t("pall")]].map(([v,lab])=>`<button type="button" class="chip" data-p="${v}" aria-pressed="${S.period===v}">${esc(lab)}</button>`).join("");
  const mgrSel = S.boss && S.managers.length>1 ? `<select id="mgr" aria-label="${esc(t("manager"))}"><option value="">${esc(t("allm"))}</option>${S.managers.map(m=>`<option ${m===S.mgr?"selected":""}>${esc(m)}</option>`).join("")}</select>` : "";
  return `<div class="bar-tools"><div class="chips" id="per">${per}</div>${mgrSel}</div>
    <section class="kpis">${tiles.map(([a,b])=>`<div class="kpi"><span class="label">${esc(a)}</span><b class="num">${b}</b></div>`).join("")}</section>
    <section class="panel"><h2>${esc(t("fun"))}</h2><div class="funnel">${fun}</div></section>
    <section class="panel"><h2>${esc(t("bySource"))}</h2><div class="scroll"><table>${th}<tbody>${group("source")||`<tr><td colspan="6">—</td></tr>`}</tbody></table></div></section>
    ${S.boss && S.managers.length>1 && !S.mgr ? `<section class="panel"><h2>${esc(t("byMgr"))}</h2><div class="scroll"><table>${th}<tbody>${group("manager")}</tbody></table></div></section>` : ""}`;
}
function bindStats(){
  $("#per").onclick = e => { const b=e.target.closest(".chip"); if(!b) return; S.period=+b.dataset.p; render(); };
  const m=$("#mgr"); if(m) m.onchange = () => { S.mgr=m.value; render(); };
}

/* ---------- іске қосу ---------- */
window.addEventListener("hashchange", render);
$("#reload").onclick = load;
$("#fab").onclick = () => openLead(null);
document.querySelectorAll(".lang button").forEach(b => b.onclick = () => { LANG=b.dataset.lang; try{localStorage.setItem("beles_lang",LANG);}catch{} render(); });
chrome();
load();
setInterval(() => { const ae=document.activeElement; if (!S.open && document.visibilityState==="visible" && !(ae && /INPUT|TEXTAREA|SELECT/.test(ae.tagName))) load(); }, 120000);
</script>
</body>
</html>
