:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

</style>

let LANG = "kk"; try { const s = localStorage.getItem("beles_lang"); if (s==="ru"||s==="kk") LANG = s; } catch {}
const t = k => T[LANG][k];
const sn = c => SN[LANG][c] || c;

const S = { me:"", boss:false, leads:[], sources:[], services:[], managers:[], loaded:false, err:null,
  q:"", stage:"new", mgr:"", repDay:null, period:30, open:null, busy:new Set() };
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const nf0 = new Intl.NumberFormat("ru-RU",{maximumFractionDigits:0});
const nf1 = new Intl.NumberFormat("ru-RU",{maximumFractionDigits:1});
const gs = (fn, ...a) => new Promise((res, rej) => google.script.run.withSuccessHandler(res).withFailureHandler(rej)[fn](...a));
const pad = n => String(n).padStart(2,"0");
const fmtDT = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
const parseDT = s => s ? new Date(String(s).replace(" ","T")) : null;
const dayKey = s => String(s||"").slice(0,10);
const todayKey = () => fmtDT(new Date()).slice(0,10);
function human(s){ if(!s) return ""; const d=parseDT(s); if(isNaN(d)) return s; const k=dayKey(s); const tm=`${pad(d.getHours())}:${pad(d.getMinutes())}`;
  const off = n => { const x=new Date(); x.setDate(x.getDate()+n); return fmtDT(x).slice(0,10); };
  if(k===off(0)) return (LANG==="ru"?"сегодня ":"бүгін ")+tm; if(k===off(-1)) return (LANG==="ru"?"вчера ":"кеше ")+tm; if(k===off(1)) return (LANG==="ru"?"завтра ":"ертең ")+tm;
  return `${pad(d.getDate())}.${pad(d.getMonth()+1)} ${tm}`; }
const normPhone = v => { let d=String(v||"").replace(/\D/g,""); if(d.length===11&&d[0]==="8") d="7"+d.slice(1); if(d.length===10) d="7"+d; return d.length>=10&&d.length<=15?d:""; };
const phoneFmt = p => { const d=String(p||""); return d.length===11 && d[0]==="7" ? `+7 ${d.slice(1,4)} ${d.slice(4,7)} ${d.slice(7,9)} ${d.slice(9)}` : (d?"+"+d:""); };
const isDue = l => l.nextCall && OPEN.includes(l.status) && parseDT(l.nextCall) <= new Date();
let toastT; function toast(x){ const el=$("#toast"); el.textContent=x; el.hidden=false; clearTimeout(toastT); toastT=setTimeout(()=>el.hidden=true,2600); }

async function load(){
  $("#reload").disabled = true;
  try { const d = await gs("crmData", KEY); Object.assign(S, {me:d.me, boss:d.boss, leads:d.leads, sources:d.sources, services:d.services, managers:d.managers, loaded:true, err:null}); }
  catch(e){ S.err = String((e && e.message) || e); }
  $("#reload").disabled = false; render();
}
function route(){ const h=location.hash.slice(1); return ["voronka","esep","taldau"].includes(h) ? h : "voronka"; }
function chrome(){
  document.documentElement.lang = LANG;
  document.querySelectorAll(".lang button").forEach(b=>b.setAttribute("aria-pressed", b.dataset.lang===LANG));
  document.querySelectorAll(".tabs a").forEach(a=>{ a.textContent=t("tabs")[a.dataset.v]; a.setAttribute("aria-current", a.dataset.v===route()?"page":"false"); });
  $("#reload").textContent = t("reload");
  $("#who").textContent = S.me ? (S.boss ? `${S.me} · ${LANG==="ru"?"все лиды":"барлық лидтер"}` : S.me) : "";
}
function render(){
  chrome();
  const el = $("#view");
  if (S.err && !S.loaded){ el.innerHTML = `<div class="state"><h2>${esc(t("err"))}</h2><p>${esc(S.err)}</p><button class="btn primary" id="retry" type="button">${esc(t("reload"))}</button></div>`; $("#retry").onclick=load; return; }
  if (!S.loaded) return;
  const v = route();
  if (v==="voronka"){ const keep = captureFocus(); el.innerHTML = viewBoard(); bindBoard(); restoreFocus(keep); }
  if (v==="esep"){ el.innerHTML = viewReport(); bindReport(); }
  if (v==="taldau"){ el.innerHTML = viewStats(); bindStats(); }
}
function captureFocus(){ const a=document.activeElement; return a && a.id && /^(q|newPhone)$/.test(a.id) ? {id:a.id, pos:a.selectionStart} : null; }
function restoreFocus(k){ if(!k) return; const n=document.getElementById(k.id); if(n){ n.focus(); try{ n.setSelectionRange(k.pos,k.pos); }catch{} } }

/* ---------- воронка ---------- */
const scoped = () => S.leads.filter(l => !S.mgr || l.manager===S.mgr);
function leadHtml(l){
  const due = isDue(l), digits = String(l.phone||"");
  const meta = [];
  if (l.source) meta.push(esc(l.source));
  if (S.boss && l.manager) meta.push(esc(l.manager));
  if (l.status==="booked" && l.appt) meta.push(`${esc(t("appt"))}: ${esc(human(l.appt))}`);
  else if (l.nextCall && OPEN.includes(l.status)) meta.push(`<span class="${due?"due":""}">${esc(t("next"))}: ${esc(human(l.nextCall))}</span>`);
  meta.push(`${esc(t("since"))}: ${esc(human(l.created))}`);
  const busy = S.busy.has(l.id);
  const moves = MOVES[l.status].map(c=>`<button type="button" class="mv m-${c}" data-mv="${c}" ${busy?"disabled":""}>→ ${esc(sn(c))}</button>`).join("");
  return `<div class="lead ${due?"due":""}" data-id="${esc(l.id)}">
    <div class="lead-top"><button type="button" class="ph" data-open="1">${esc(phoneFmt(digits))}</button>
      ${digits?`<a class="wa-mini" href="https://wa.me/${esc(digits)}" target="_blank" rel="noopener">WA</a>`:""}</div>
    <div class="meta">${meta.map(m=>`<span>${m}</span>`).join("")}</div>
    ${moves?`<div class="moves">${moves}</div>`:""}</div>`;
}
function viewBoard(){
  const base = scoped();
  const qd = S.q.replace(/\D/g,"");
  const mgrSel = S.boss && S.managers.length>1 ? `<select id="mgr" aria-label="${esc(t("manager"))}"><option value="">${esc(t("allm"))}</option>${S.managers.map(m=>`<option ${m===S.mgr?"selected":""}>${esc(m)}</option>`).join("")}</select>` : "";
  const top = `<form class="quickadd" id="addForm" autocomplete="off"><input id="newPhone" type="tel" inputmode="tel" placeholder="${esc(t("addPh"))}" aria-label="${esc(t("addPh"))}"><button class="btn primary" type="submit">${esc(t("add"))}</button></form>
    <div class="bar-tools"><input class="search" id="q" type="search" inputmode="tel" placeholder="${esc(t("search"))}" value="${esc(S.q)}" autocomplete="off">${mgrSel}</div>`;
  if (qd){
    const found = base.filter(l => l.phone.includes(qd)).sort((a,b)=>(b.updated||b.created).localeCompare(a.updated||a.created));
    return top + (found.length ? `<div class="col active">${found.map(l=>leadHtml(l).replace('<div class="meta">',`<div class="meta"><span class="pill ${ST_CLASS[l.status]}">${esc(sn(l.status))}</span>`)).join("")}</div>`
      : `<div class="col-empty">${esc(t("nofound"))}</div>`);
  }
  const by = {}; STAGES.forEach(c=>by[c]=[]); base.forEach(l=>(by[l.status]||by.new).push(l));
  STAGES.forEach(c=>by[c].sort((a,b)=>{ const da=isDue(a), db=isDue(b); if(da!==db) return da?-1:1; return (b.updated||b.created).localeCompare(a.updated||a.created); }));
  const due = base.filter(isDue).length;
  const chips = STAGES.map(c=>`<button type="button" class="chip" data-st="${c}" aria-pressed="${S.stage===c}">${esc(sn(c))}<b>${by[c].length}</b></button>`).join("");
  const cols = STAGES.map(c=>`<section class="col ${S.stage===c?"active":""}" data-col="${c}"><div class="col-head"><h3>${esc(sn(c))}</h3><b>${by[c].length}</b></div>
    ${by[c].length ? by[c].map(leadHtml).join("") : `<div class="col-empty">${esc(t("none"))}</div>`}</section>`).join("");
  const dueNote = due ? `<div class="notice">${esc(t("due"))}: <b>${due}</b></div>` : "";
  return top + dueNote + `<div class="stages" id="stages">${chips}</div><div class="board" id="board">${cols}</div>`;
}
function bindBoard(){
  const q=$("#q"); q.oninput = () => { S.q=q.value; render(); };
  const m=$("#mgr"); if(m) m.onchange = () => { S.mgr=m.value; render(); };
  const st=$("#stages"); if(st) st.onclick = e => { const b=e.target.closest(".chip"); if(!b) return; S.stage=b.dataset.st; render(); };
  $("#addForm").onsubmit = async e => {
    e.preventDefault();
    const inp=$("#newPhone"), phone=normPhone(inp.value);
    if (!phone){ toast(t("phoneBad")); inp.focus(); return; }
    const local = S.leads.find(l=>l.phone===phone);
    if (local){ inp.value=""; openLead(local.id); toast(t("dup")); return; }
    inp.disabled = true;
    try {
      const r = await gs("crmSave", KEY, {phone, status:"new"});
      inp.disabled = false;
      if (r.duplicate){ if (r.lead){ upsert(r.lead); inp.value=""; openLead(r.lead.id); toast(t("dup")); } else toast(t("dupOther")(r.other)); return; }
      upsert(r.lead); inp.value=""; S.stage="new"; S.q=""; render(); toast(t("added")); $("#newPhone").focus();
    } catch(err){ inp.disabled=false; toast(t("saveErr")+" "+String((err&&err.message)||err)); }
  };
  $("#view").onclick = e => {
    const card = e.target.closest(".lead"); if (!card) return;
    if (e.target.closest("[data-open]")) { openLead(card.dataset.id); return; }
    const mv = e.target.closest("[data-mv]"); if (mv) move(card.dataset.id, mv.dataset.mv);
  };
}
async function move(id, to){
  const l = S.leads.find(x=>x.id===id); if (!l || S.busy.has(id)) return;
  const before = Object.assign({}, l);
  const input = {id, status:to};
  if (to==="noans" && (!l.nextCall || parseDT(l.nextCall) <= new Date())){ const d=new Date(); d.setHours(d.getHours()+2); input.nextCall = fmtDT(d); }
  Object.assign(l, input); l.updated = fmtDT(new Date()); S.busy.add(id); render();
  toast(t("moved")(phoneFmt(l.phone), sn(to)));
  try { const r = await gs("crmSave", KEY, input); S.busy.delete(id); upsert(r.lead); render();
    if (to==="booked" && !r.lead.appt){ openLead(id); toast(t("setAppt")); setTimeout(()=>{ const a=$("#f_appt"); if(a) a.focus(); }, 50); } }
  catch(err){ S.busy.delete(id); Object.assign(l, before); render(); toast(t("moveErr")+" "+String((err&&err.message)||err)); }
}
function upsert(lead){ const i=S.leads.findIndex(x=>x.id===lead.id); if(i>=0) S.leads[i]=lead; else S.leads.unshift(lead); }

/* ---------- карточка ---------- */
function openLead(id){
  const l = S.leads.find(x=>x.id===id); if (!l) return;
  S.open = Object.assign({}, l); renderCard();
}
const toLocal = s => s ? s.replace(" ","T") : "";
const fromLocal = s => s ? s.replace("T"," ").slice(0,16) : "";
function renderCard(){
  const l = S.open, sh = $("#sheet"), digits = String(l.phone||"");
  const opt = (arr, v) => { const a = arr.slice(); if (v && !a.includes(v)) a.unshift(v); return `<option value=""></option>` + a.map(x=>`<option ${x===v?"selected":""}>${esc(x)}</option>`).join(""); };
  const hist = (l.history||"").split("\n").filter(Boolean).reverse().map(line=>{ const p=line.split(" · "); return `<li><time>${esc(p[0])} · ${esc(p[1]||"")}</time>${esc(p.slice(2).join(" · "))}</li>`; }).join("");
  sh.innerHTML = `<div class="card" role="dialog" aria-modal="true" aria-labelledby="cardTitle">
    <div class="card-head"><div><span class="pill ${ST_CLASS[l.status]}">${esc(sn(l.status))}</span><h2 id="cardTitle" class="num" style="margin-top:6px">${esc(phoneFmt(digits))}</h2>${l.name?`<span class="sub">${esc(l.name)}</span>`:""}</div>
      <button class="x" type="button" id="close" aria-label="×">×</button></div>
    <div class="contact"><a class="btn wa" href="https://wa.me/${esc(digits)}" target="_blank" rel="noopener">${esc(t("wa"))}</a><a class="btn" href="tel:+${esc(digits)}">${esc(t("call"))}</a></div>
    <form id="leadForm" class="panel" autocomplete="off">
      <div class="fields">
        <div class="field wide"><label>${esc(t("stage"))}</label><div class="status-grid" id="stGrid">${STAGES.map(c=>`<button type="button" data-s="${c}" aria-pressed="${c===l.status}">${esc(sn(c))}</button>`).join("")}</div></div>
        <div class="field"><label for="f_phone">${esc(t("phone"))}</label><input id="f_phone" type="tel" inputmode="tel" value="${esc(phoneFmt(digits))}"></div>
        <div class="field"><label for="f_source">${esc(t("source"))}</label><select id="f_source">${opt(S.sources, l.source)}</select></div>
        <div class="field"><label for="f_service">${esc(t("service"))}</label><input id="f_service" list="svc" value="${esc(l.service)}" maxlength="100"><datalist id="svc">${S.services.map(x=>`<option>${esc(x)}</option>`).join("")}</datalist></div>
        ${S.boss && S.managers.length>1 ? `<div class="field"><label for="f_manager">${esc(t("manager"))}</label><select id="f_manager">${S.managers.map(m=>`<option ${m===l.manager?"selected":""}>${esc(m)}</option>`).join("")}</select></div>` : ""}
        <div class="field" id="wrapNext"><label for="f_next">${esc(t("nextCall"))}</label><input id="f_next" type="datetime-local" value="${esc(toLocal(l.nextCall))}">
          <div class="quick" id="quick"><button type="button" data-q="h2">${esc(t("q").h2)}</button><button type="button" data-q="tom">${esc(t("q").tom)}</button><button type="button" data-q="d3">${esc(t("q").d3)}</button><button type="button" data-q="clr">${esc(t("q").clr)}</button></div></div>
        <div class="field" id="wrapAppt"><label for="f_appt">${esc(t("apptF"))}</label><input id="f_appt" type="datetime-local" value="${esc(toLocal(l.appt))}"></div>
        <div class="field wide"><label for="f_note">${esc(t("note"))}</label><textarea id="f_note" maxlength="2000">${esc(l.note)}</textarea></div>
        <div class="field wide"><label for="f_comment">${esc(t("comment"))}</label><input id="f_comment" maxlength="1000" placeholder="${esc(t("comment_ph"))}"></div>
      </div>
      <div class="bar-tools"><button class="btn primary" type="submit" id="saveLead">${esc(t("save"))}</button><span class="msg" id="leadMsg"></span></div>
    </form>
    ${hist ? `<section class="panel"><h2>${esc(t("hist"))}</h2><ul class="hist">${hist}</ul></section>` : ""}
  </div>`;
  sh.hidden = false; document.body.style.overflow = "hidden";
  const close = () => { sh.hidden = true; sh.innerHTML = ""; document.body.style.overflow = ""; S.open = null; };
  $("#close").onclick = close;
  sh.onclick = e => { if (e.target === sh) close(); };
  document.onkeydown = e => { if (e.key==="Escape" && !sh.hidden) close(); };
  const syncVis = () => { $("#wrapAppt").hidden = !BOOKED.includes(l.status) && !$("#f_appt").value; $("#wrapNext").hidden = !OPEN.includes(l.status) && !$("#f_next").value; };
  syncVis();
  $("#stGrid").onclick = e => { const b=e.target.closest("button"); if(!b) return; l.status=b.dataset.s; $("#stGrid").querySelectorAll("button").forEach(x=>x.setAttribute("aria-pressed", x===b)); syncVis(); };
  $("#quick").onclick = e => { const b=e.target.closest("button"); if(!b) return; const d=new Date();
    if(b.dataset.q==="h2") d.setHours(d.getHours()+2); if(b.dataset.q==="tom"){ d.setDate(d.getDate()+1); d.setHours(10,0,0,0); } if(b.dataset.q==="d3"){ d.setDate(d.getDate()+3); d.setHours(10,0,0,0); }
    $("#f_next").value = b.dataset.q==="clr" ? "" : fmtDT(d).replace(" ","T"); };
  $("#leadForm").onsubmit = async e => {
    e.preventDefault();
    const msg = $("#leadMsg"), btn = $("#saveLead");
    const input = { id:l.id, phone:$("#f_phone").value, source:$("#f_source").value, service:$("#f_service").value, status:l.status,
      nextCall:fromLocal($("#f_next").value), appt:fromLocal($("#f_appt").value), note:$("#f_note").value, comment:$("#f_comment").value };
    if ($("#f_manager")) input.manager = $("#f_manager").value;
    if (!normPhone(input.phone)){ msg.className="msg err"; msg.textContent=t("phoneBad"); return; }
    btn.disabled = true; msg.className="msg"; msg.textContent=t("saving");
    try { const r = await gs("crmSave", KEY, input); upsert(r.lead); close(); toast(t("saved")); render(); }
    catch(err){ btn.disabled=false; msg.className="msg err"; msg.textContent = t("saveErr") + " " + String((err && err.message) || err); }
  };
}

/* ---------- бүгінгі есеп ---------- */
function dayCounts(leads, day){
  const ls = leads.filter(l => dayKey(l.created)===day);
  const n = arr => ls.filter(l => arr.includes(l.status)).length;
  const booked = n(BOOKED);
  return [ls.length, booked, n(["noans"]), n(["new","work"]), n(["refused"]), ls.length ? booked/ls.length*100 : null];
}
function viewReport(){
  const day = S.repDay || todayKey();
  const groups = S.boss ? S.managers.map(m=>[m, S.leads.filter(l=>l.manager===m)]) : [[S.me, S.leads]];
  if (S.boss && S.managers.length>1) groups.push([t("total"), S.leads]);
  const labK = t("r_kk");
  const cols = groups.map(g=>dayCounts(g[1], day));
  const cell = (c,i) => i===5 ? (c[5]==null?"—":nf1.format(c[5])+"%") : nf0.format(c[i]);
  const head = `<tr><th></th>${groups.map(g=>`<th>${esc(g[0])}</th>`).join("")}</tr>`;
  const body = REP_RU.map((x,i)=>`<tr><td>${esc(labK[i])}${LANG==="ru"?"":`<br><span class="sub">${esc(x)}</span>`}</td>${cols.map(c=>`<td>${cell(c,i)}</td>`).join("")}</tr>`).join("");
  const d = day.split("-");
  const txt = groups.map((g,gi)=>`Белес CRM — ${d[2]}.${d[1]} — ${g[0]}\n` + REP_RU.map((x,i)=>`${x}: ${cell(cols[gi],i)}`).join("\n")).join("\n\n");
  return `<section class="panel"><div class="panel-head"><h2>${esc(t("rep"))}</h2><span class="sub">${esc(t("rep_sub"))}</span></div>
    <div class="bar-tools"><label class="sub" for="repDay">${esc(t("day"))}</label><input class="search" style="flex:0 1 200px" id="repDay" type="date" value="${esc(day)}"></div>
    <div class="scroll"><table><thead>${head}</thead><tbody>${body}</tbody></table></div></section>
    <section class="panel"><div class="bar-tools"><button class="btn primary" id="copy" type="button">${esc(t("copy"))}</button></div><textarea class="report" id="repTxt" readonly>${esc(txt)}</textarea></section>`;
}
function bindReport(){
  $("#repDay").onchange = e => { S.repDay = e.target.value || null; render(); };
  $("#copy").onclick = () => { const ta=$("#repTxt"); const fb=()=>{ ta.focus(); ta.select(); toast(t("copyfail")); };
    try { navigator.clipboard.writeText(ta.value).then(()=>toast(t("copied")), fb); } catch { fb(); } };
}

/* ---------- талдау ---------- */
function viewStats(){
  let ls = scoped();
  if (S.period){ const from=new Date(); from.setDate(from.getDate()-S.period+1); const fk=fmtDT(from).slice(0,10); ls = ls.filter(l=>dayKey(l.created)>=fk); }
  const c = arr => ls.filter(l=>arr.includes(l.status)).length;
  const leads=ls.length, booked=c(BOOKED), came=c(["came","bought"]), bought=c(["bought"]), open=c(OPEN), overdue=ls.filter(isDue).length;
  const k = t("k");
  const tiles = [[k[0],nf0.format(leads)],[k[1],nf0.format(booked)],[k[2],leads?nf1.format(booked/leads*100)+"%":"—"],[k[3],nf0.format(bought)],[k[4],nf0.format(open)],[k[5],nf0.format(overdue)]];
  const steps = [[t("f")[0],leads],[t("f")[1],booked],[t("f")[2],came],[t("f")[3],bought]];
  const fun = steps.map(([lab,v],i)=>{ const prev=i?steps[i-1][1]:null; const w=leads?Math.max(v?2:0,v/leads*100):0;
    return `<div class="fstep"><span>${esc(lab)}</span><span class="v num">${nf0.format(v)}${i&&prev?`<span class="pct">${nf1.format(v/prev*100)}% ${esc(t("ofprev"))}</span>`:""}</span><div class="bar"><i style="width:${w}%"></i></div></div>`; }).join("");
  const stageRows = STAGES.map(s=>{ const v=c([s]); return `<div class="fstep"><span>${esc(sn(s))}</span><span class="v num">${nf0.format(v)}${leads?`<span class="pct">${nf1.format(v/leads*100)}%</span>`:""}</span><div class="bar"><i style="width:${leads&&v?Math.max(2,v/leads*100):0}%"></i></div></div>`; }).join("");
  const group = key => { const m={}; ls.forEach(l=>{ const g=l[key]||"—"; (m[g]=m[g]||[]).push(l); });
    return Object.entries(m).sort((a,b)=>b[1].length-a[1].length).map(([g,arr])=>{ const n=s=>arr.filter(l=>s.includes(l.status)).length; const b=n(["bought"]);
      return `<tr><td>${esc(g)}</td><td>${arr.length}</td><td>${n(BOOKED)}</td><td>${n(["came","bought"])}</td><td>${b}</td><td>${arr.length?nf1.format(b/arr.length*100)+"%":"—"}</td></tr>`; }).join(""); };
  const th = `<thead><tr><th></th><th>${esc(t("leads"))}</th><th>${esc(t("booked"))}</th><th>${esc(t("came"))}</th><th>${esc(t("bought"))}</th><th>${esc(t("conv"))}</th></tr></thead>`;
  const per = [[7,t("p7")],[30,t("p30")],[0,t("pall")]].map(([v,lab])=>`<button type="button" class="chip" data-p="${v}" aria-pressed="${S.period===v}">${esc(lab)}</button>`).join("");
  const mgrSel = S.boss && S.managers.length>1 ? `<select id="mgr" aria-label="${esc(t("manager"))}"><option value="">${esc(t("allm"))}</option>${S.managers.map(m=>`<option ${m===S.mgr?"selected":""}>${esc(m)}</option>`).join("")}</select>` : "";
  return `<div class="bar-tools"><div class="chips" id="per">${per}</div>${mgrSel}</div>
    <section class="kpis">${tiles.map(([a,b])=>`<div class="kpi"><span class="label">${esc(a)}</span><b class="num">${b}</b></div>`).join("")}</section>
    <section class="panel"><h2>${esc(t("fun"))}</h2><div class="funnel">${fun}</div></section>
    <section class="panel"><h2>${esc(t("stage"))}</h2><div class="funnel">${stageRows}</div></section>
    <section class="panel"><h2>${esc(t("bySource"))}</h2><div class="scroll"><table>${th}<tbody>${group("source")||`<tr><td colspan="6">—</td></tr>`}</tbody></table></div></section>
    ${S.boss && S.managers.length>1 && !S.mgr ? `<section class="panel"><h2>${esc(t("byMgr"))}</h2><div class="scroll"><table>${th}<tbody>${group("manager")}</tbody></table></div></section>` : ""}`;
}
function bindStats(){
  $("#per").onclick = e => { const b=e.target.closest(".chip"); if(!b) return; S.period=+b.dataset.p; render(); };
  const m=$("#mgr"); if(m) m.onchange = () => { S.mgr=m.value; render(); };
}

/* ---------- іске қосу ---------- */
window.addEventListener("hashchange", render);
$("#reload").onclick = load;
document.querySelectorAll(".lang button").forEach(b => b.onclick = () => { LANG=b.dataset.lang; try{localStorage.setItem("beles_lang",LANG);}catch{} render(); });
chrome();
load();
setInterval(() => { const ae=document.activeElement; if (!S.open && !S.busy.size && document.visibilityState==="visible" && !(ae && /INPUT|TEXTAREA|SELECT/.test(ae.tagName))) load(); }, 120000);

</script>
</body>
</html>
