# Белес CRM: docker compose up -d --build
# Конфигурация: .env (deploy/install.sh жасайды)
name: beles

x-app: &app
  build: .
  image: beles-crm:latest
  restart: unless-stopped
  env_file: .env
  environment:
    NODE_ENV: production
    DATABASE_URL: postgresql://beles:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD .env-те жоқ}@db:5432/beles
    TZ: Asia/Almaty
  depends_on:
    db:
      condition: service_healthy
  volumes:
    - uploads:/app/uploads
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "5" }

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: beles
      POSTGRES_DB: beles
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD .env-те жоқ}
      TZ: Asia/Almaty
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U beles -d beles"]
      interval: 5s
      timeout: 5s
      retries: 20
    # Порт сыртқа ашылмайды — тек ішкі желі

  app:
    <<: *app
    # Порт сыртқа ашылмайды — тек Caddy арқылы (HTTPS)
    expose: ["3000"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

  # Автоматтандыру: әр 5 минут (эскалация, еске салу, тапсырмалар) + 20:00 есеп
  cron:
    <<: *app
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://beles:${POSTGRES_PASSWORD}@db:5432/beles
      TZ: Asia/Almaty
      SKIP_DB_PUSH: "1"
    command: ["npx", "tsx", "scripts/cron.ts"]
    depends_on:
      app:
        condition: service_healthy

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:?DOMAIN .env-те жоқ}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

volumes:
  pgdata:
  uploads:
  caddy_data:
  caddy_config:
