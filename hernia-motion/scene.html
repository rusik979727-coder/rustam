<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><title>Грыжа диска — motion</title>
<style>
@font-face{font-family:U;font-weight:900;src:url(fonts/unbounded-cyrillic-900-normal.woff2) format('woff2');unicode-range:U+0400-045F}
@font-face{font-family:U;font-weight:900;src:url(fonts/unbounded-latin-900-normal.woff2) format('woff2');unicode-range:U+0000-00FF,U+2000-206F}
@font-face{font-family:U;font-weight:700;src:url(fonts/unbounded-cyrillic-700-normal.woff2) format('woff2');unicode-range:U+0400-045F}
@font-face{font-family:U;font-weight:700;src:url(fonts/unbounded-latin-700-normal.woff2) format('woff2');unicode-range:U+0000-00FF,U+2000-206F}

@font-face{font-family:M;font-weight:700;src:url(fonts/manrope-cyrillic-700-normal.woff2) format('woff2');unicode-range:U+0400-045F}

</style></head><body>
<canvas id="c" width="1920" height="1080"></canvas>
<script>
'use strict';
const W=1920,H=1080,FPS=60,NFRAMES=1600,DUR=NFRAMES/FPS,BEAT=60/90,BAR=BEAT*4;
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const lerp=(a,b,t)=>a+(b-a)*t;
const ss=(a,b,x)=>{const t=clamp((x-a)/(b-a));return t*t*(3-2*t);};
const eo3=t=>1-Math.pow(1-clamp(t),3);
const eio=t=>{t=clamp(t);return t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;};
const eob=(t,s=1.6)=>{t=clamp(t)-1;return 1+(s+1)*t*t*t+s*t*t;};
const spr=(t,f=2.2,d=6)=>t<=0?0:1-Math.exp(-d*t)*Math.cos(2*Math.PI*f*t);
const wob=(t,f=3,d=5)=>t<=0?0:Math.exp(-d*t)*Math.sin(2*Math.PI*f*t);
function mulberry(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const rgb=(c,a=1)=>`rgba(${c[0]|0},${c[1]|0},${c[2]|0},${a})`;
const mix=(a,b,t)=>[lerp(a[0],b[0],t),lerp(a[1],b[1],t),lerp(a[2],b[2],t)];

const main=document.getElementById('c'),mctx=main.getContext('2d');
function mk(){const c=document.createElement('canvas');c.width=W;c.height=H;return [c,c.getContext('2d')];}
const [tubC,tub]=mk(),[subC,sub]=mk(),[worldC,world]=mk(),[deepC,deep]=mk(),[focC,foc]=mk(),[upC,up]=mk(),[tmpC,tmp]=mk();

// ---------- palette ----------
const BONE=[236,224,201],DISC=[200,218,236],GEL=[86,226,214],SAC=[240,206,110],ROOT=[250,200,72],PAIN=[255,72,58],TEAL=[96,232,220];
const L=(()=>{const v=[-0.45,0.72,0.55];const n=Math.hypot(...v);return v.map(x=>x/n);})();

// ---------- camera ----------
// t, cu, cv, zoom, roll(deg), pitch(deg)
const KEYS=[
 [0.00,-20,-330,0.95,-7,0],[3.0,-18,-360,1.04,-6,0],[5.33,-25,-520,1.38,-4,0],[7.0,-12,-190,1.95,1,0],
 [8.0,-2,-22,2.55,3,0],[9.33,8,-25,2.8,2,8],[10.67,40,4,2.25,-4,72],[13.33,50,12,2.4,-7,66],
 [16.0,62,30,2.7,-8,60],[18.67,76,52,3.05,-10,56],[21.33,20,46,2.6,-6,54],[26.67,-112,40,2.32,-3,50]];
function camAt(t){
  const n=KEYS.length;let i=0;while(i<n-2&&t>KEYS[i+1][0])i++;
  const k0=KEYS[Math.max(0,i-1)],k1=KEYS[i],k2=KEYS[i+1],k3=KEYS[Math.min(n-1,i+2)];
  const u=clamp((t-k1[0])/(k2[0]-k1[0])),dt=k2[0]-k1[0];
  const out=[];
  for(let j=1;j<6;j++){
    const m1=i===0?(k2[j]-k1[j])/(k2[0]-k1[0]):(k2[j]-k0[j])/(k2[0]-k0[0]);
    const m2=i+2>n-1||k3===k2?(k2[j]-k1[j])/(k2[0]-k1[0]):(k3[j]-k1[j])/(k3[0]-k1[0]);
    const h00=2*u*u*u-3*u*u+1,h10=u*u*u-2*u*u+u,h01=-2*u*u*u+3*u*u,h11=u*u*u-u*u;
    out.push(h00*k1[j]+h10*dt*m1+h01*k2[j]+h11*dt*m2);
  }
  let [cu,cv,zoom,roll,pitch]=out;
  // impact shakes
  const sh=wob(t-2.667,7,7)*0+wob(t-16.0,9,6)*3.2+wob(t-18.67,8,7)*1.4;
  cu+=sh;cv+=sh*0.6;
  pitch=clamp(pitch,0,89);
  const ph=pitch*Math.PI/180,ro=roll*Math.PI/180;
  return {cu,cv,zoom,ph,sphi:Math.sin(ph),cphi:Math.cos(ph),cr:Math.cos(ro),sr:Math.sin(ro),roll:ro};
}
let C;
function P(X,Y,Z){const u=X-C.cu,v=(-Y*C.cphi+Z*C.sphi)-C.cv,x=u*C.zoom,y=v*C.zoom;return [W/2+x*C.cr-y*C.sr,H/2+x*C.sr+y*C.cr];}
function depth(Y,Z){return Y*C.sphi+Z*C.cphi;}
function Tm(Xc,Yc,a){const ca=Math.cos(a),sa=Math.sin(a);
  const f=(x,y,z)=>P(Xc+x*ca-y*sa,Yc+x*sa+y*ca,z);f.a=a;f.ca=ca;f.sa=sa;f.Yc=Yc;f.Xc=Xc;return f;}

// ---------- geometry ----------
function bean(a,b,c,n=72,def){const p=[];for(let i=0;i<n;i++){const th=i/n*Math.PI*2,co=Math.cos(th),si=Math.sin(th);let x=a*co-c*Math.pow(Math.max(0,co),8),z=b*si;if(def){const s=def(th);x*=s;z*=s;}p.push([x,z]);}return p;}
function ell(rx,rz,cx=0,cz=0,n=28){const p=[];for(let i=0;i<n;i++){const th=i/n*Math.PI*2;p.push([cx+rx*Math.cos(th),cz+rz*Math.sin(th)]);}return p;}
function scaleAbout(p,s,cx,cz){return p.map(([x,z])=>[cx+(x-cx)*s,cz+(z-cz)*s]);}
function shade(base,N,rimK=.22){const nl=Math.max(0,N[0]*L[0]+N[1]*L[1]+N[2]*L[2]);const nv=Math.max(0,N[1]*C.sphi+N[2]*C.cphi);
  const s=.30+.80*nl,r=rimK*Math.pow(1-nv,2.2);return [clamp(base[0]*s+120*r,0,255),clamp(base[1]*s+200*r,0,255),clamp(base[2]*s+230*r,0,255)];}
function poly(ctx,pts){ctx.beginPath();ctx.moveTo(pts[0][0],pts[0][1]);for(let i=1;i<pts.length;i++)ctx.lineTo(pts[i][0],pts[i][1]);ctx.closePath();}
function capPath(ctx,T,pts,y){poly(ctx,pts.map(([x,z])=>T(x,y,z)));}
// extruded prism, outline pts CCW in (x,z)
function prism(ctx,T,pts,y0,y1,base,capFill,opt={}){
  const n=pts.length,faces=[];
  for(let i=0;i<n;i++){const a=pts[i],b=pts[(i+1)%n];let nx=b[1]-a[1],nz=-(b[0]-a[0]);const ln=Math.hypot(nx,nz)||1;nx/=ln;nz/=ln;
    const N=[nx*T.ca,nx*T.sa,nz];const vis=N[1]*C.sphi+N[2]*C.cphi;if(vis<=0.002)continue;
    const mz=(a[1]+b[1])/2;faces.push({a,b,N,d:depth(T.Yc,mz)});}
  faces.sort((p,q)=>p.d-q.d);
  ctx.lineWidth=1.1;ctx.lineJoin='round';
  for(const f of faces){const c=shade(base,f.N,opt.rim??.22);const col=rgb(c,1);ctx.fillStyle=col;ctx.strokeStyle=col;
    const q=[T(f.a[0],y0,f.a[1]),T(f.b[0],y0,f.b[1]),T(f.b[0],y1,f.b[1]),T(f.a[0],y1,f.a[1])];poly(ctx,q);ctx.fill();ctx.stroke();}
  if(opt.fibers&&faces.length){ // annulus fibre hatching on side wall
    ctx.save();ctx.strokeStyle='rgba(120,150,190,.35)';ctx.lineWidth=Math.max(.6,.9*C.zoom*.5);
    for(let i=0;i<n;i+=2){const a=pts[i],b=pts[(i+3)%n];let nx=pts[(i+1)%n][1]-a[1],nz=-(pts[(i+1)%n][0]-a[0]);const N=[nx*T.ca,nx*T.sa,nz];if(N[1]*C.sphi+N[2]*C.cphi<=0.05)continue;
      const p0=T(a[0],y0,a[1]),p1=T(b[0],y1,b[1]);ctx.beginPath();ctx.moveTo(p0[0],p0[1]);ctx.lineTo(p1[0],p1[1]);ctx.stroke();}
    ctx.restore();}
  const capVis=T.ca*C.sphi;
  if(capVis>0.004&&capFill){capPath(ctx,T,pts,y1);capFill(ctx);}
}

function bodyPrism(ctx,T){prism(ctx,T,BODY,-65,-50,BONE,null);prism(ctx,T,BODY_W,-50,50,mix(BONE,[215,195,170],.25),null,{rim:.18});prism(ctx,T,BODY,50,65,BONE,()=>capBone(ctx,T,65));}
const BODY=bean(90,118,40),HV=130,HD=42;
const BODY_W=scaleAbout(bean(90,118,40),.9,-6,0);
function capBone(ctx,T,y,r=95){const c=T(0,y,0);const g=ctx.createRadialGradient(c[0],c[1],0,c[0],c[1],r*C.zoom);
  g.addColorStop(0,rgb(mix(BONE,[200,170,150],.35)));g.addColorStop(.75,rgb(mix(BONE,[210,190,165],.15)));g.addColorStop(1,rgb(BONE));ctx.fillStyle=g;ctx.fill();
  ctx.strokeStyle='rgba(255,250,235,.55)';ctx.lineWidth=2.2*C.zoom*.5;ctx.stroke();}

// anatomy constants

const lordX=Y=>-46*Math.exp(-Math.pow((Y-300)/420,2))+46*Math.exp(-Math.pow(300/420,2));
const lordA=Y=>-Math.atan((lordX(Y+1)-lordX(Y-1))/2);
const VERT=[602,430,258,86,-86]; // L1..L5 centre Y
const SAC_C=[128,0],SAC_R=[26,40];
const TH_H=0.86; // herniation direction parameter
const E0=(()=>{const co=Math.cos(TH_H),si=Math.sin(TH_H);return [92*co-40*Math.pow(co,8),120*si];})();
const N0=(()=>{const co=Math.cos(TH_H),si=Math.sin(TH_H);let nx=co/92,nz=si/120;const l=Math.hypot(nx,nz);return [nx/l,nz/l];})();
const ROOTP=[E0[0]+N0[0]*42,E0[1]+N0[1]*42],ROOTR=11;
const rnd=mulberry(11);
const CRACK=(()=>{const a=[];for(let k=0;k<=12;k++){a.push([lerp(.40,1.0,k/12),(k===0||k===12)?0:(rnd()-.5)*.12]);}return a;})();
const BRANCH=[[0.55,0.09,0.66],[0.74,-0.1,0.83],[0.86,0.07,0.94]];
const CAUDA=(()=>{const r=mulberry(5),a=[];for(let i=0;i<14;i++){const th=r()*6.283,rr=Math.sqrt(r())*.72;a.push([SAC_C[0]+Math.cos(th)*SAC_R[0]*rr,Math.sin(th)*SAC_R[1]*rr,2.2+r()*2]);}return a;})();
// arch (L5) axial outline z>=0 half
const ARCH_OUT_H=[[318,0],[300,24],[206,34],[180,72],[150,112],[128,132],[122,150],[110,236],[88,236],[80,152],[52,130],[44,112]];
const ARCH_IN_H=[[176,0],[160,70],[128,118],[102,142],[82,112],[52,86]];
function mirrorClosed(h){const a=h.slice();for(let i=h.length-1;i>=0;i--){if(h[i][1]!==0||i!==0)a.push([h[i][0],-h[i][1]]);}return a;}
const ARCH_OUT=(()=>{const a=ARCH_OUT_H.slice();for(let i=ARCH_OUT_H.length-1;i>=1;i--)a.push([ARCH_OUT_H[i][0],-ARCH_OUT_H[i][1]]);return a;})();
const ARCH_IN=(()=>{const a=ARCH_IN_H.slice();for(let i=ARCH_IN_H.length-1;i>=1;i--)a.push([ARCH_IN_H[i][0],-ARCH_IN_H[i][1]]);return a;})();

// ---------- timeline helpers ----------
const sideA=()=>1-ss(.30,.72,C.sphi);
const axialA=()=>ss(.25,.8,C.sphi);
function pressPulse(t){ // 0..1 pulses on beats 13.33..16
  let p=0;for(const b of [13.333,14.0,14.667,15.333,16.0]){const d=t-b+.12;if(d>-0.2&&d<0.7)p=Math.max(p,d<0?ss(-.2,0,d):Math.exp(-d*5));}
  return p*ss(13.2,13.6,t)*(1-ss(16.3,17.0,t));}
function crackP(t){let p=0;const b=[14.0,14.667,15.333,16.0];for(let i=0;i<4;i++)p+=.25*eo3((t-b[i]+.02)/.14);return clamp(p);}
function herniaQ(t){return eio((t-16.05)/2.5);}
function painK(t){return ss(18.55,18.9,t);}

// ---------- posterior elements (side view, planar XY) ----------
function postSide(ctx,T,alpha){
  if(alpha<=0.01)return;
  const pts=[[58,52],[118,60],[130,98],[158,96],[168,44],[288,22],[302,2],[292,-22],[176,-42],[162,-96],[138,-100],[126,-46],[60,18]];
  ctx.save();ctx.globalAlpha=alpha*.92;
  const pp=pts.map(([x,y])=>T(x,y,8));
  ctx.beginPath();const m=(a,b)=>[(a[0]+b[0])/2,(a[1]+b[1])/2];let s=m(pp[pp.length-1],pp[0]);ctx.moveTo(s[0],s[1]);
  for(let i=0;i<pp.length;i++){const n=m(pp[i],pp[(i+1)%pp.length]);ctx.quadraticCurveTo(pp[i][0],pp[i][1],n[0],n[1]);}
  ctx.closePath();
  const a=T(60,0,0),b=T(300,0,0);const g=ctx.createLinearGradient(a[0],a[1],b[0],b[1]);
  g.addColorStop(0,rgb(mix(BONE,[150,140,130],.25)));g.addColorStop(.5,rgb(BONE));g.addColorStop(1,rgb(mix(BONE,[120,110,110],.4)));
  ctx.fillStyle=g;ctx.fill();ctx.strokeStyle='rgba(255,248,230,.5)';ctx.lineWidth=1.6*C.zoom*.5;ctx.stroke();
  // transverse process end-on
  const tp=T(100,30,10);ctx.beginPath();ctx.ellipse(tp[0],tp[1],24*C.zoom,22*C.zoom*Math.max(.05,C.cphi),C.roll,0,6.283);
  ctx.fillStyle=rgb(mix(BONE,[255,255,255],.1));ctx.fill();ctx.strokeStyle='rgba(120,100,90,.35)';ctx.stroke();
  ctx.restore();}
function exitRoot(ctx,T,alpha,pain=0){
  if(alpha<=0.01)return;const pts=[[112,-40],[84,-64],[50,-92],[10,-132],[-30,-178]].map(([x,y])=>T(x,y,60));
  ctx.save();ctx.globalAlpha=alpha;ctx.lineCap='round';
  for(const [w,c] of [[20,mix([120,90,30],PAIN,pain)],[15,mix(ROOT,PAIN,pain)],[5,[255,240,170]]]){
    ctx.beginPath();ctx.moveTo(pts[0][0],pts[0][1]);for(let i=1;i<pts.length-1;i++){const m=[(pts[i][0]+pts[i+1][0])/2,(pts[i][1]+pts[i+1][1])/2];ctx.quadraticCurveTo(pts[i][0],pts[i][1],m[0],m[1]);}
    ctx.lineTo(pts[pts.length-1][0],pts[pts.length-1][1]);ctx.strokeStyle=rgb(c,w===4?.45:1);ctx.lineWidth=w*C.zoom*.5;ctx.stroke();}
  ctx.restore();}

// ---------- scene ----------
function drawWorld(t){
  for(const c of [deep,foc,up,tub])c.clearRect(0,0,W,H);
  const straight=1-ss(8.2,9.6,t);
  const lift=320*eio((t-9.15)/1.35),upA=1-ss(9.55,10.45,t);
  const sA=sideA(),aA=axialA();
  const press=pressPulse(t),cr=crackP(t),hq=herniaQ(t),pk=painK(t);

  // ---- deep layer: sacrum, L5-S1 disc, L5 body, L5 arch
  {const ctx=deep;
   // sacrum (planar side shape) + S1 cylinder
   const Ts=Tm(lordX(-262)+8,-262,(lordA(-262)+.22)*straight+.0);
   prism(ctx,Ts,BODY,-69,69,BONE,()=>capBone(ctx,Ts,69));
   if(sA>0.01){ctx.save();ctx.globalAlpha=sA*.9;const sp=[[-80,-60],[70,-60],[170,-300],[120,-330],[0,-250]].map(([x,y])=>Ts(x,y,0));poly(ctx,sp);
     const g=ctx.createLinearGradient(sp[0][0],sp[0][1],sp[2][0],sp[2][1]);g.addColorStop(0,rgb(BONE));g.addColorStop(1,rgb(mix(BONE,[90,80,80],.5)));ctx.fillStyle=g;ctx.fill();ctx.restore();}
   const Td2=Tm(lordX(-172)+3,-172,lordA(-172)*straight+.08*straight);
   prism(ctx,Td2,bean(92,120,40),-21,21,DISC,()=>{ctx.fillStyle=rgb(DISC);ctx.fill();},{fibers:true});
   const T5=Tm(lordX(-86),-86,(lordA(-86)+.05)*straight);
   // arch (axial) – only when looking from above
   if(aA>0.01){ctx.save();ctx.globalAlpha=aA;
     for(let s=0;s<14;s++){const y=lerp(-140,-40,s/13);ctx.beginPath();const o=ARCH_OUT.map(([x,z])=>T5(x,y+86,z)),h=ARCH_IN.map(([x,z])=>T5(x,y+86,z));
       ctx.moveTo(o[0][0],o[0][1]);o.forEach(p=>ctx.lineTo(p[0],p[1]));ctx.closePath();ctx.moveTo(h[0][0],h[0][1]);h.forEach(p=>ctx.lineTo(p[0],p[1]));ctx.closePath();
       const cc=s<13?mix(BONE,[40,45,70],.62-s*.025):mix(BONE,[150,150,165],.32);ctx.fillStyle=rgb(cc);ctx.fill('evenodd');ctx.strokeStyle=rgb(cc);ctx.lineWidth=2;ctx.stroke();}
     ctx.strokeStyle='rgba(255,246,225,.45)';ctx.lineWidth=1.5;ctx.stroke();ctx.restore();}
   bodyPrism(ctx,T5);
  }
  // ---- focus layer
  {const ctx=foc;
   const T5=Tm(lordX(-86),-86,(lordA(-86)+.05)*straight);
   const Tsac=Tm(0,0,0);
   // dural sac lower part
   prism(tub,Tsac,ell(SAC_R[0],SAC_R[1],SAC_C[0],0,30),-900,21,SAC,()=>{const ctx=tub;
     ctx.fillStyle=rgb(mix(SAC,[255,240,200],.25));ctx.fill();ctx.strokeStyle='rgba(255,250,220,.7)';ctx.lineWidth=1.5;ctx.stroke();
     for(const [x,z,r] of CAUDA){const p=Tsac(x,21,z);ctx.beginPath();ctx.ellipse(p[0],p[1],r*C.zoom*.9,r*C.zoom*.9*C.sphi,C.roll,0,6.283);ctx.fillStyle='rgba(205,150,60,.75)';ctx.fill();}
   },{rim:.12});
   // traversing roots (vertical tubes in lateral recess), near side compressed
   for(const side of [-1,1]){
     const isH=side===1, comp=isH?pk:0;
     const rp=[ROOTP[0]+(isH?N0[0]*4*comp:0),side*ROOTP[1]+(isH?N0[1]*4*comp:0)];
     let pts=ell(ROOTR*(1-.22*comp),ROOTR,rp[0],rp[1],22);
     const col=mix(ROOT,PAIN,isH?pk:0);
     prism(tub,Tsac,pts,-900,18,col,()=>{tub.fillStyle=rgb(mix(col,[255,255,230],.25));tub.fill();},{rim:.15});
     // connection from sac
     if(aA>0.01){ctx.save();ctx.globalAlpha=aA;ctx.lineCap='round';const a=Tsac(118,12,side*34),m=Tsac(108,12,side*88),b=Tsac(rp[0],12,rp[1]);
       ctx.beginPath();ctx.moveTo(a[0],a[1]);ctx.quadraticCurveTo(m[0],m[1],b[0],b[1]);ctx.strokeStyle=rgb(mix(col,[120,80,20],.3));ctx.lineWidth=17*C.zoom*.5;ctx.stroke();
       ctx.strokeStyle=rgb(col);ctx.lineWidth=13*C.zoom*.5;ctx.stroke();ctx.restore();}
   }
   postSide(ctx,T5,sA);
   exitRoot(ctx,Tm(lordX(-172),-172+50,0),sA*.95);
   // disc L4-L5 with deformation
   const def=th=>{let d=th-TH_H;d=Math.atan2(Math.sin(d),Math.cos(d));return 1+.028*press+(.05*press+.05*cr+.03*hq)*Math.exp(-d*d/.05);};
   const Td=Tm(0,0,(lordA(0)+.03)*straight);
   const dpts=bean(92,120,40,72,def);
   prism(ctx,Td,dpts,-21,21,DISC,null,{fibers:true});
   if(Td.ca*C.sphi>0.004)discCap(ctx,Td,def,t,{press,cr,hq,pk});
   // extruded fragment
   if(hq>0.001)hernia(ctx,Td,def,t,hq,pk);
   // root caps again on top of the blob edge for contact read
  }
  // ---- upper stack (lifts away)
  if(upA>0.01){const ctx=up;
   const TsacU=Tm(0,lift,0);
   prism(ctx,TsacU,ell(SAC_R[0],SAC_R[1],SAC_C[0],0,30),21,1200,SAC,null,{rim:.12});

  if(idx>0&&ch<.5){ctx.globalAlpha=a*(1-k);ctx.fillText(CHAP[idx-1][1].toUpperCase(),260,95-lerp(0,40,k));}
  ctx.letterSpacing='0px';ctx.restore();
  // progress line
  ctx.globalAlpha=a*.8;ctx.fillStyle='rgba(255,255,255,.15)';ctx.fillRect(120,116,330,2);ctx.fillStyle=rgb(TEAL);ctx.fillRect(120,116,330*clamp(t/DUR),2);
  ctx.restore();}
function overlays(ctx,t){
  // bottom gradient for captions
  const cg=ss(13.2,13.6,t)*(1-ss(21.0,21.6,t))+ss(8.0,8.3,t)*(1-ss(9.4,9.8,t))*0;
  if(cg>0){const g=ctx.createLinearGradient(0,H-330,0,H);g.addColorStop(0,'rgba(4,8,16,0)');g.addColorStop(1,`rgba(4,8,16,${.75*cg})`);ctx.fillStyle=g;ctx.fillRect(0,H-330,W,330);}
  // vertebra tags

  if(tagA>0){ctx.save();ctx.font='700 26px U';const names=['L1','L2','L3','L4','L5'];
    for(let i=0;i<5;i++){const Y=VERT[i];const p=P(lordX(Y)-150,Y,0);const hi=i>=3?1:0;
      const act=ss(5.3+i*.5,5.6+i*.5,t);ctx.globalAlpha=tagA*(.45+.55*act);ctx.fillStyle=hi&&t>7.6?rgb(TEAL):'rgba(220,235,250,.9)';ctx.textAlign='right';ctx.fillText(names[i],p[0],p[1]+9);
      ctx.fillRect(p[0]+10,p[1]-1,26*act,2);}
    ctx.textAlign='left';ctx.restore();}
  // disc label (side)

  // axial labels

  label(ctx,t,Td(10,21,-12),-200,-300,'Пульпозное ядро','упругий гель',11.25,13.25);
  label(ctx,t,Td(ROOTP[0],18,ROOTP[1]),260,110,'Нервный корешок',null,11.65,13.25,ROOT);
  caption(ctx,t,'Нагрузка и износ диска →','в фиброзном кольце появляется трещина',13.55,16.0);
  caption(ctx,t,'Ядро выдавливается через разрыв —','это и есть грыжа диска',16.15,18.6);
  caption(ctx,t,'Грыжа давит на нервный корешок:','боль, онемение, слабость в ноге',18.8,21.25,true);

}
function final(ctx,t){
  if(t<21.3)return;const dimA=ss(21.3,22.3,t);
  const g=ctx.createLinearGradient(0,0,W*.7,0);g.addColorStop(0,`rgba(4,8,16,${.86*dimA})`);g.addColorStop(.75,`rgba(4,8,16,${.45*dimA})`);g.addColorStop(1,'rgba(4,8,16,0)');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  ctx.save();
  ctx.font='900 128px U';const ws=[...TITLE].map(c=>ctx.measureText(c).width);let x=120;const base=372;
  for(let i=0;i<TITLE.length;i++){const ti=t-(21.55+.07*i);if(ti<0){x+=ws[i]+10;continue;}const k=eo3(ti/.5);
    let oy=lerp(60,0,k),al=k,col=[245,250,255];
    if(i===2){const kk=spr(t-22.25,1.4,5);oy=lerp(150,0,kk);al=ss(21.6,21.9,t);col=mix(GEL,[245,250,255],ss(22.4,22.9,t));}
    ctx.save();ctx.beginPath();ctx.rect(x-6,base-150,ws[i]+12,i===2?360:170);ctx.clip();ctx.globalAlpha=al;ctx.fillStyle=rgb(col);ctx.fillText(TITLE[i],x,base+oy);ctx.restore();x+=ws[i]+10;}
  const st=t-22.0;if(st>0){ctx.font='500 40px M';ctx.letterSpacing=lerp(18,4,eo3(st/.8))+'px';ctx.fillStyle=`rgba(200,225,240,${eo3(st/.5)})`;ctx.fillText('межпозвонкового диска',124,440);ctx.letterSpacing='0px';}
  const lk=eo3((t-22.5)/.6);ctx.fillStyle=rgb(TEAL);ctx.fillRect(124,490,560*lk,3);
  const lines=['Ядро диска выходит через разрыв','фиброзного кольца и может','сдавливать нервный корешок.'];
  ctx.font='500 38px M';
  lines.forEach((ln,j)=>{let xx=124;const y=566+j*54;ln.split(' ').forEach((w,i)=>{const k=eo3((t-22.75-j*.22-i*.05)/.45);const ww=ctx.measureText(w+' ').width;if(k>0){ctx.save();ctx.beginPath();ctx.rect(xx-4,y-44,ww+8,60);ctx.clip();ctx.fillStyle='rgba(232,242,250,1)';ctx.fillText(w,xx,y+lerp(46,0,k));ctx.restore();}xx+=ww;});});
  const dk=eo3((t-23.9)/.6);if(dk>0){ctx.globalAlpha=dk;ctx.strokeStyle='rgba(255,255,255,.25)';ctx.lineWidth=1.5;ctx.beginPath();ctx.roundRect(124,800,720,64,32);ctx.stroke();
    ctx.font='500 26px M';ctx.fillStyle='rgba(205,220,235,.95)';ctx.fillText('Учебная анимация · не заменяет консультацию врача',156,842);}
  ctx.restore();}

// ---------- grain/vignette ----------
const [grainC,gctx]=(()=>{const c=document.createElement('canvas');c.width=c.height=256;const x=c.getContext('2d');const d=x.createImageData(256,256);const r=mulberry(9);for(let i=0;i<d.data.length;i+=4){const v=r()*255;d.data[i]=d.data[i+1]=d.data[i+2]=v;d.data[i+3]=255;}x.putImageData(d,0,0);return [c,x];})();
function finish(ctx,t,fi){
  const v=ctx.createRadialGradient(W/2,H/2,H*.45,W/2,H/2,W*.68);v.addColorStop(0,'rgba(0,0,0,0)');v.addColorStop(1,'rgba(0,0,0,.55)');ctx.fillStyle=v;ctx.fillRect(0,0,W,H);
  ctx.save();ctx.globalCompositeOperation='overlay';ctx.globalAlpha=.07;const r=mulberry(fi+1);const ox=-(r()*256)|0,oy=-(r()*256)|0;
  for(let y=oy;y<H;y+=256)for(let x=ox;x<W;x+=256)ctx.drawImage(grainC,x,y);ctx.restore();}

// ---------- frame ----------
function renderScene(ctx,t){
  C=camAt(t);
  background(ctx,t);
  drawWorld(t);
  const subjBlur=14*(1-ss(3.6,5.0,t));
  const dimW=1-.4*(1-ss(3.4,5.0,t));
  ctx.save();ctx.globalAlpha=dimW;if(subjBlur>.3)ctx.filter=`blur(${subjBlur.toFixed(2)}px)`;ctx.drawImage(worldC,0,0);ctx.restore();ctx.filter='none';
  // radial accent blur
  for(const [tc,px,amt] of [[2.667,null,.05],[16.0,'crack',.06]]){const d=t-tc;if(d<0||d>.4)continue;const k=Math.exp(-d*9)*amt;let cx=W/2,cy=H/2;
    if(px==='crack'){const co=Math.cos(TH_H),si=Math.sin(TH_H);[cx,cy]=P(E0[0],21,E0[1]);}
    tmp.clearRect(0,0,W,H);tmp.drawImage(subC===ctx.canvas?subC:ctx.canvas,0,0);
    for(let s=1;s<=4;s++){const sc=1+k*s/4;ctx.save();ctx.globalAlpha=.22;ctx.translate(cx,cy);ctx.scale(sc,sc);ctx.translate(-cx,-cy);ctx.drawImage(tmpC,0,0);ctx.restore();}}
  foreground(ctx,t);
  title(ctx,t);
}
function samplesAt(t){
  const a=camAt(t-.5/FPS),b=camAt(t+.5/FPS);
  const pa=[],pb=[];for(const [X,Y,Z] of [[0,0,0],[0,-300,0],[200,0,100]]){C=a;pa.push(P(X,Y,Z));C=b;pb.push(P(X,Y,Z));}
  let sp=0;for(let i=0;i<3;i++)sp=Math.max(sp,Math.hypot(pa[i][0]-pb[i][0],pa[i][1]-pb[i][1]));
  let n=Math.round(sp/3.2)+1;
  if(t<1.4||(t>2.6&&t<3.1)||(t>15.95&&t<16.25)||(t>21.5&&t<22.5))n=Math.max(n,4);
  return clamp(n,1,6);}
function renderFrame(fi){
  const t=fi/FPS;const n=samplesAt(t);
  mctx.globalAlpha=1;mctx.clearRect(0,0,W,H);
  for(let k=0;k<n;k++){const tk=n===1?t:t+(k/(n-1)-.5)*.5/FPS;sub.clearRect(0,0,W,H);renderScene(sub,Math.max(0,tk));
    mctx.globalAlpha=1/(k+1);mctx.drawImage(subC,0,0);}
  mctx.globalAlpha=1;C=camAt(t);
  overlays(mctx,t);finish(mctx,t,fi);
  return n;}
window.renderFrame=renderFrame;window.DUR=DUR;window.NFRAMES=NFRAMES;
window.ready=(async()=>{for(const f of ['900 100px U','700 30px U','400 30px U','400 30px M','500 30px M','700 30px M'])await document.fonts.load(f,'АБВЫЖабв L1');await document.fonts.ready;return true;})();
// preview: ?t=seconds or ?play
const q=new URLSearchParams(location.search);
window.ready.then(()=>{if(q.has('t'))renderFrame(Math.round(parseFloat(q.get('t'))*FPS));
  else if(q.has('play')){const s=performance.now();const loop=()=>{const fi=Math.floor((performance.now()-s)/1000*FPS)%NFRAMES;renderFrame(fi);requestAnimationFrame(loop);};loop();}
  else renderFrame(0);});
