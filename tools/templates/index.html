<!doctype html>
<html lang="kk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <!-- GENERATED by tools/gen.py from tools/templates/index.html + cues.json — edit the template, then re-run -->
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
      /*FONTS*/
      :root {
        --panel: #fcfbf8;
        --ink: #1b2a44;
        --line: rgba(27, 42, 68, 0.1);
        --accent: #2f6b6b;
        --ground: #efece6;
        --shadow: 0 28px 90px rgba(0, 0, 0, 0.34);
        --font: "BelesSans", -apple-system, "SF Pro Display", system-ui, sans-serif;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: var(--ground); }
      #root { position: relative; width: 1080px; height: 1920px; font-family: var(--font); background: var(--ground); }
      #cam {
        position: absolute; left: 0; top: 0; width: 1080px; height: 1920px;
        overflow: hidden; z-index: 1; transform-origin: 50% 33%;
      }
      #raw { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; object-fit: cover; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="{{ END }}" data-width="1080" data-height="1920">
      <div id="cam">
        <video id="raw" class="clip" data-start="0" data-duration="{{ MEDIA }}" data-track-index="0"
               src="assets/cut.mp4" muted playsinline></video>
      </div>
      <audio id="mix" class="clip" data-start="0" data-duration="{{ END }}" data-track-index="1"
             data-volume="1" src="assets/audio_mixed.wav"></audio>

      <div id="s1" data-composition-id="s1" data-composition-src="compositions/s1.html" data-track-kind="graphics"
           data-start="{{ h1 }}" data-duration="{{ s2Start - h1 }}" data-track-index="2" data-width="1080" data-height="1920" style="z-index:20"></div>
      <div id="s2" data-composition-id="s2" data-composition-src="compositions/s2.html" data-track-kind="graphics"
           data-start="{{ h2 }}" data-duration="{{ s3In + 0.5 - h2 }}" data-track-index="3" data-width="1080" data-height="1920" style="z-index:21"></div>
      <div id="s3" data-composition-id="s3" data-composition-src="compositions/s3.html" data-track-kind="graphics"
           data-start="{{ s3In }}" data-duration="{{ s4In - s3In }}" data-track-index="2" data-width="1080" data-height="1920" style="z-index:40"></div>
      <div id="s4" data-composition-id="s4" data-composition-src="compositions/s4.html" data-track-kind="graphics"
           data-start="{{ s4In }}" data-duration="{{ egerP - s4In }}" data-track-index="3" data-width="1080" data-height="1920" style="z-index:22"></div>
      <div id="s5" data-composition-id="s5" data-composition-src="compositions/s5.html" data-track-kind="graphics"
           data-start="{{ s5In }}" data-duration="{{ s6In + 0.5 - s5In }}" data-track-index="2" data-width="1080" data-height="1920" style="z-index:23"></div>
      <div id="s6" data-composition-id="s6" data-composition-src="compositions/s6.html" data-track-kind="graphics"
           data-start="{{ s6In }}" data-duration="{{ END - s6In }}" data-track-index="3" data-width="1080" data-height="1920" style="z-index:41"></div>
      <div id="captions" data-composition-id="captions" data-composition-src="compositions/captions.html" data-track-kind="captions"
           data-start="0" data-duration="{{ END }}" data-track-index="4" data-width="1080" data-height="1920" style="z-index:50"></div>

      <div id="badge" data-composition-id="badge" data-composition-src="compositions/badge.html" data-track-kind="graphics"
           data-start="0" data-duration="{{ END }}" data-track-index="5" data-width="1080" data-height="1920" style="z-index:60"></div>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      // punch-ins: hard cuts on emphasis words (no creeping zooms)
      tl.set("#cam", { scale: 1, x: 0, y: 0, borderRadius: 0, boxShadow: "0 0 0 rgba(0,0,0,0)" }, 0);
      tl.set("#cam", { scale: 1.12 }, {{ punch1 }});
      tl.set("#cam", { scale: 1 }, {{ s2Start }});
      tl.set("#cam", { scale: 1.1 }, {{ pain }});
      tl.set("#cam", { scale: 1 }, {{ s3In + 0.5 }});
      tl.set("#cam", { scale: 1.08 }, {{ egerP }});
      // slide-scene for the CTA: speaker shrinks down, card takes the top
      tl.to("#cam", { scale: 0.62, y: 320, borderRadius: 44, boxShadow: "0 28px 90px rgba(0,0,0,0.34)",
                      duration: 0.6, ease: "power3.inOut" }, {{ s5In }});
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
